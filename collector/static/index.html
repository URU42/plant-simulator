<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>plant-simulator · 현재값</title>
<!-- 디버깅 화면 (RFCC 설계 §4.6, 다중 공장 §4.7). 공장 접두어 아래에서 상대 경로 equipment / current / stream 을 쓴다. 의존성 없음. -->
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e3e3e3; --head: #f5f5f5; --flash: #fff3b0; --bad: #c0392b; }
  body { margin: 0; padding: 16px 24px 48px; font: 14px/1.4 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         color: var(--fg); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; margin-bottom: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  header .meta { color: var(--muted); }
  header .meta b { color: var(--fg); font-variant-numeric: tabular-nums; }
  #status.ok { color: #1e7e34; } #status.down { color: var(--bad); }
  section { margin-bottom: 20px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  h2 small { color: var(--muted); font-weight: normal; margin-left: 8px; }
  table { border-collapse: collapse; width: 100%; max-width: 1232px; }
  th, td { padding: 3px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { background: var(--head); font-weight: 600; color: var(--muted); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  td.flash { background: var(--flash); transition: background 0.5s; }
  tr.bad td { color: var(--muted); } tr.bad td.quality { color: var(--bad); font-weight: 600; }
  tr.nodata td.value::after { content: " (NoData)"; color: var(--muted); font-family: inherit; }
</style>
</head>
<body>
<header>
  <h1 id="title">plant-simulator · 현재값</h1>
  <span class="meta">sim_now(KST) <b id="sim-now">—</b></span>
  <span class="meta">SSE <b id="status" class="down">연결 중</b></span>
  <span class="meta">받은 샘플 <b id="count">0</b></span>
</header>
<main id="main"></main>

<script>
(function () {
  const rows = new Map();          // "equip_id|tag_id" → { tr, tds, decimals }. 태그명은 설비 사이에서 겹칠 수 있다
  const keyOf = (s) => `${s.equip_id}|${s.tag_id}`;
  let received = 0, simNowMs = 0;

  const kst = (iso) => iso ? new Date(iso).toLocaleString("sv-SE", { timeZone: "Asia/Seoul" }) : "—";
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function buildTables(equipment) {
    const main = document.getElementById("main");
    for (const e of equipment) {
      const section = el("section");
      const h2 = el("h2", null, `${e.equip_id} · ${e.name}`);
      h2.appendChild(el("small", null, `${e.unit_group_name} / ${e.unit_name}` + (e.driven_by ? ` · 구동: ${e.driven_by}` : "")));
      section.appendChild(h2);
      const table = el("table");
      const thead = el("thead"); const hr = el("tr");
      for (const h of ["태그 ID", "설명", "값", "단위", "품질", "측정 시각(KST)", "주기"]) hr.appendChild(el("th", null, h));
      thead.appendChild(hr); table.appendChild(thead);
      const tbody = el("tbody");
      for (const t of e.tags) {
        const tr = el("tr"); tr.id = `tag-${e.equip_id}-${t.tag_id}`;
        const tds = {
          id: el("td", null, t.tag_id), desc: el("td", null, t.description || ""), value: el("td", "num value", "—"),
          unit: el("td", null, t.unit), quality: el("td", "quality", "—"), ts: el("td", "num", "—"), iv: el("td", "num", t.interval_sec + "s"),
        };
        if (t.limits) tds.value.title = "한계값 " + Object.entries(t.limits).map(([k, v]) => `${k}=${v}`).join(", ");
        for (const k of ["id", "desc", "value", "unit", "quality", "ts", "iv"]) tr.appendChild(tds[k]);
        tbody.appendChild(tr);
        rows.set(`${e.equip_id}|${t.tag_id}`, { tr, tds, decimals: t.decimals });
      }
      table.appendChild(tbody); section.appendChild(table); main.appendChild(section);
    }
  }

  // 한 샘플(또는 /current 행)로 행을 갱신한다. status 가 있으면(/current) NoData 표시에 쓴다.
  function update(s, flash) {
    const row = rows.get(keyOf(s));
    if (!row) return;
    const good = (s.quality === "Good" || s.quality === "Uncertain") && s.value != null;   // Uncertain 도 값이 있다
    row.tds.value.textContent = good ? Number(s.value).toFixed(row.decimals) : "—";
    row.tds.quality.textContent = s.quality || "—";
    row.tds.ts.textContent = kst(s.ts);
    row.tr.classList.toggle("bad", !!s.ts && !good);
    row.tr.classList.toggle("nodata", s.status === "NoData" && !!s.ts);
    if (flash) {
      row.tds.value.classList.add("flash");
      setTimeout(() => row.tds.value.classList.remove("flash"), 500);
    }
    const ms = s.ts ? Date.parse(s.ts) : 0;          // UTC / +09:00 표기가 섞여도 시각으로 비교한다
    if (ms > simNowMs) { simNowMs = ms; document.getElementById("sim-now").textContent = kst(s.ts); }
  }

  function connect() {
    const status = document.getElementById("status");
    const es = new EventSource("stream");                  // 공장 접두어 기준 상대 경로. 끊기면 스스로 다시 연결한다
    es.onopen = () => { status.textContent = "연결됨"; status.className = "ok"; };
    es.onerror = () => { status.textContent = "재연결 중"; status.className = "down"; };
    es.addEventListener("samples", (ev) => {
      const samples = JSON.parse(ev.data);
      received += samples.length;
      document.getElementById("count").textContent = received.toLocaleString();
      // 백필 묶음은 한 이벤트에 수십만 샘플이 온다. 태그마다 가장 늦은 샘플 하나만 반영한다.
      const latest = new Map();
      for (const s of samples) {
        const prev = latest.get(keyOf(s));
        if (!prev || s.ts > prev.ts) latest.set(keyOf(s), s);
      }
      for (const s of latest.values()) { s.status = undefined; update(s, true); }
    });
  }

  fetch("health").then((r) => r.json()).then((h) => {
    document.getElementById("title").textContent = `${h.plant_name || h.plant_id} · 현재값`;
    document.title = `${h.plant_id} · 현재값`;
  }).catch(() => {});
  fetch("equipment").then((r) => r.json()).then((equipment) => {
    buildTables(equipment);
    return fetch("current").then((r) => r.json());
  }).then((current) => {
    for (const s of current) update(s, false);
    connect();
  }).catch((err) => { document.getElementById("status").textContent = "불러오기 실패: " + err; });
})();
</script>
</body>
</html>
