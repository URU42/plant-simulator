# 기본: 통합 실행 컨테이너 하나(plant-sim)가 수집 서버와 다섯 공장 생성기를 함께 돈다 (k8s 와 같은 모양).
#   docker compose up --build -d
# 분리 실행(수집 서버 1 + 시뮬레이터 5, HTTP 전송)은 split 프로필:
#   docker compose --profile split up --build -d
# 죽어도 다시 살아나 계속 생성한다 (restart: always). DB 는 네임드 볼륨 plant-data 의 <key>.db 에 남는다.
# 바인드 마운트(./data)를 쓰지 않는 이유: macOS Docker Desktop 의 바인드 마운트 위에서 SQLite WAL 이 손상된 적이 있다.
# 파일을 꺼내려면 docker compose cp plant-sim:/app/data/cdu.db ./data/ 처럼 복사한다.
# SIM_TIME_MODE 기본 backfill: 각 공장이 runtime 의 backfill_days(1일)를 채운 뒤 실시간으로 이어진다.
services:
  plant-sim:
    build: .
    command: python -m collector.app --plants config/plants.yaml --with-simulators --time-mode ${SIM_TIME_MODE:-backfill} --port 8000
    ports: ["8000:8000"]
    environment:
      ROOT_PATH: ${ROOT_PATH:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes:
      - plant-data:/app/data
      - ./config:/app/config:ro
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  collector:
    build: .
    profiles: [split]
    command: python -m collector.app --plants config/plants.yaml --port 8000
    ports: ["8000:8000"]
    volumes:
      - plant-data:/app/data
      - ./config:/app/config:ro
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  sim-rfcc:
    build: .
    profiles: [split]
    command: python -m simulator.main --plant config/plant_rfcc.yaml --runtime config/runtime_rfcc.yaml --scenario config/scenario_rfcc.yaml --time-mode ${SIM_TIME_MODE:-backfill}
    environment:
      COLLECTOR_URL: http://collector:8000/rfcc
    volumes:
      - ./config:/app/config:ro
    depends_on:
      collector:
        condition: service_healthy
    restart: always

  sim-cdu:
    build: .
    profiles: [split]
    command: python -m simulator.main --plant config/plant_cdu.yaml --runtime config/runtime_cdu.yaml --scenario config/scenario_cdu.yaml --time-mode ${SIM_TIME_MODE:-backfill}
    environment:
      COLLECTOR_URL: http://collector:8000/cdu
    volumes:
      - ./config:/app/config:ro
    depends_on:
      collector:
        condition: service_healthy
    restart: always

  sim-hou:
    build: .
    profiles: [split]
    command: python -m simulator.main --plant config/plant_hou.yaml --runtime config/runtime_hou.yaml --scenario config/scenario_hou.yaml --time-mode ${SIM_TIME_MODE:-backfill}
    environment:
      COLLECTOR_URL: http://collector:8000/hou
    volumes:
      - ./config:/app/config:ro
    depends_on:
      collector:
        condition: service_healthy
    restart: always

  sim-rhds:
    build: .
    profiles: [split]
    command: python -m simulator.main --plant config/plant_rhds.yaml --runtime config/runtime_rhds.yaml --scenario config/scenario_rhds.yaml --time-mode ${SIM_TIME_MODE:-backfill}
    environment:
      COLLECTOR_URL: http://collector:8000/rhds
    volumes:
      - ./config:/app/config:ro
    depends_on:
      collector:
        condition: service_healthy
    restart: always

  sim-vrds:
    build: .
    profiles: [split]
    command: python -m simulator.main --plant config/plant_vrds.yaml --runtime config/runtime_vrds.yaml --scenario config/scenario_vrds.yaml --time-mode ${SIM_TIME_MODE:-backfill}
    environment:
      COLLECTOR_URL: http://collector:8000/vrds
    volumes:
      - ./config:/app/config:ro
    depends_on:
      collector:
        condition: service_healthy
    restart: always

volumes:
  plant-data:
