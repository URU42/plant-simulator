# 실행 설정 (기획서 4.2). 설정 파일 경로(plant / scenario / db)는 명령행 인자로 준다.
units: [all]                 # 이 프로세스가 맡을 Unit. [U-1] 처럼 주면 그 Unit만 돌린다
source_id: SIM-ALL           # 메시지의 source_id. Unit별로 나눌 때는 SIM-U1 ~ SIM-U6
sample_interval_sec: 10      # 값 생성 주기
send_interval_sec: 60        # 묶어서 보내는 주기
time_mode: live              # backfill / live / accelerated
speed: 60                    # accelerated 모드 배율
backfill_days: 90            # 백필 기간
seed: 20261108               # 같은 시드면 같은 데이터
collector_url: http://localhost:8000
raw_retention_days: 7        # 원시 값 보관 기간
