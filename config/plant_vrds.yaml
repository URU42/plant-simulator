# 구성안: VRDS (감압 잔사유 수첨탈황) (PL-VRDS) — 다중 공장 설계 docs/superpowers/specs/2026-11-09-multi-plant-design.md
# - 출처: RHDS_VRDS_v3/data/VRDS_*.xlsx 의 `설비 설명`(계층)·`설비 태그`(태그명·설명·단위·정상 기준·경고/알람/정지 상·하한·근거) 시트. 마스터 값은 그대로.
# - 태그명은 자료의 이름에 설비 종류 문자를 넣어 공장 안에서 고유하게 바꿨다 (P-4101 의 TI-B-4101 → TI-B-P4101). 키는 그대로 (equip_id, tag_id). 한계값·정상 기준·근거는 자료 그대로이며 빈 칸은 적지 않았다.
# - 알람·정지값은 자료에 없어 CDU·HOU 의 같은 신호 경고→알람→정지 간격을 경고값에 적용했다 (규칙은 limit_basis). 유효숫자 3자리.
# - normal.base 는 데이터 첫 6시간 Good·Uncertain 평균, noise_sd 는 첫 1시간을 추세 제거한 표준편차의 0.9배, decimals 는 데이터의 소수 자릿수.
# - 온도 10초, 나머지 1초. 신호 모델은 rfcc. seed_key 는 공장 접두어를 붙여 다른 공장과 겹치지 않는다.

plant:
  plant_id: PL-VRDS
  name: "VRDS (감압 잔사유 수첨탈황)"
  config_version: 4
  signal_model: rfcc
  unit_groups:
    - id: UG-VRDS-01
      name: "원료 공급"
      units:
        - { id: UNIT-VRDS-01, name: "잔사유 가압·공급" }
    - id: UG-VRDS-02
      name: "수소 공급"
      units:
        - { id: UNIT-VRDS-02, name: "보충 수소 압축" }
    - id: UG-VRDS-03
      name: "수첨탈황 반응"
      units:
        - { id: UNIT-VRDS-03, name: "수소 순환" }
    - id: UG-VRDS-04
      name: "반응 가열"
      units:
        - { id: UNIT-VRDS-04, name: "연소공기 공급" }
    - id: UG-VRDS-05
      name: "고온 유체 처리"
      units:
        - { id: UNIT-VRDS-05, name: "잔사유 이송" }
    - id: UG-VRDS-06
      name: "생성물 분별"
      units:
        - { id: UNIT-VRDS-06, name: "환류·순환" }

# 설비 유형 매핑. kind 는 신호 모델이 보는 기계 종류
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: CC, name: 압축기, prefix: C, kind: compressor }
  - { type: FN, name: 팬, prefix: F, kind: fan }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: "mm/s RMS", name: 케이싱 진동 속도 }
  - { signal: bearing_temp, prefix: TI, unit: "DEG C", name: 베어링 온도 }
  - { signal: suction_pressure, prefix: PI, unit: "bar(g)", name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PI, unit: "bar(g)", name: 토출 압력 }
  - { signal: flow, prefix: FI, unit: "m3/h", name: 유량 }
  - { signal: current, prefix: II, unit: "A", name: 모터 전류 }
  - { signal: suction_temp, prefix: TI, unit: "DEG C", name: 흡입 온도 }
  - { signal: discharge_temp, prefix: TI, unit: "DEG C", name: 토출 온도 }
  - { signal: speed, prefix: SI, unit: "rpm", name: 회전속도 }
  - { signal: shaft_vibration, prefix: XI, unit: "um pk-pk", name: 축 상대 진동 }
  - { signal: axial_position, prefix: ZI, unit: "mm", name: 축방향 위치 }
  - { signal: oil_pressure, prefix: PI, unit: "bar(g)", name: 윤활유 압력 }
  - { signal: oil_temp, prefix: TI, unit: "DEG C", name: 윤활유 온도 }
  - { signal: differential_pressure, prefix: PDI, unit: "Pa", name: 차압 }
  - { signal: process_temp, prefix: TI, unit: "DEG C", name: 공정 유체 온도 }

equipment:
  # ---------------- UNIT-VRDS-01 잔사유 가압·공급 ----------------
