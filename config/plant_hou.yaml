# 구성안: HOU (수첨분해) — 다중 공장 설계 docs/superpowers/specs/2026-11-09-multi-plant-design.md
# - 출처: hou-plant-sample/data/HOU_*.xlsx 의 `설비 설명`(계층)·`설비 태그`(태그명·설명·단위·정상 기준·경고/알람/정지 상·하한·근거) 시트. 마스터 값은 그대로.
# - 태그명은 같은 설비 안에서만 고유하다 (복합키 (equip_id, tag_id)). 한계값·정상 기준·근거는 자료 그대로이며 빈 칸은 적지 않았다.
# - decimals 는 데이터의 소수 자릿수.
# - 온도 10초, 나머지 1초. seed_key 는 공장 접두어를 붙여 다른 공장과 겹치지 않는다.

# - 같은 설비 안 관계 (2026-11-19, synthetic): derive 가 있는 태그는 매 표본 그 시각 같은 설비 태그로 계산한다 — 펌프 전류 ∝ 유량 × 양정,
#   팬 전류 ∝ 유량³·차압 ∝ 유량², 압축기 토출 온도(K) ∝ 흡입 온도(K) × 압축비^m (m 은 자료 μ 로 맞춤), 베어링 온도(K) ∝ 윤활유 온도(K).
#   식이 정하는 변동을 그대로 쓴다(물리식 우선, 사용자 확정). μ 는 자료 그대로, σ 는 식만의 변동이 자료 σ 를 넘으면 정상 생성값으로 바꿨다
#   (자체 잡음 = 자료 σ × 0.3). 자료 σ 이하면 자료 σ 에 맞게 자체 잡음으로 채웠다. RFCC 의 μ±3σ 경고 한계는 새 σ 로 다시 계산했다(2026-11-23 공학 기준값으로 바뀜).
plant:
  plant_id: HOU
  name: "HOU (수첨분해)"
  config_version: 7                 # 2026-11-27 추가 계측(스트레이너·회전수·밸브 개도·이중화 토출·헤더 유량) 반영. 2026-11-26 압축기 구동기 추가. 2026-11-25 PU-D5a: P-2101-S2 추가 (직렬 2단), 바뀐 μ·σ·한계는 limit_basis
  unit_groups:
    - id: UG-HOU-01
      name: "원료 공급"
      units:
        - { id: UNIT-HOU-01, name: "원료 가압·공급" }
    - id: UG-HOU-02
      name: "수소 공급"
      units:
        - { id: UNIT-HOU-02, name: "보충 수소 압축" }
    - id: UG-HOU-03
      name: "수첨반응"
      units:
        - { id: UNIT-HOU-03, name: "수소 순환" }
        - { id: UNIT-HOU-04, name: "반응기 가열" }
    - id: UG-HOU-04
      name: "기액 분리·순환"
      units:
        - { id: UNIT-HOU-05, name: "압축기 지원" }
    - id: UG-HOU-05
      name: "생성물 분별"
      units:
        - { id: UNIT-HOU-06, name: "분별탑 환류" }
        - { id: UNIT-HOU-07, name: "미전환유 순환" }

# 설비 유형 매핑. kind 는 기계 종류 (참고)
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: CC, name: 압축기, prefix: C, kind: compressor }
  - { type: FN, name: 팬, prefix: F, kind: fan }
  - { type: MT, name: 전동기, prefix: M, kind: motor }
  - { type: GB, name: 기어박스, prefix: GB, kind: gearbox }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: "mm/s RMS", name: 케이싱 진동 속도 }
  - { signal: bearing_temp, prefix: TI, unit: "DEG C", name: 베어링 온도 }
  - { signal: suction_pressure, prefix: PI, unit: "kg/cm2(g)", name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PI, unit: "kg/cm2(g)", name: 토출 압력 }
  - { signal: redundant_discharge_pressure, prefix: PI, unit: "kg/cm2(g)", name: 토출 압력(이중화 전송기) }   # 2026-11-27 추가 계측 (synthetic)
  - { signal: interstage_pressure, prefix: PI, unit: "kg/cm2(g)", name: 단간 압력 }
  - { signal: flow, prefix: FI, unit: "m3/h", name: 유량 }
  - { signal: current, prefix: II, unit: "A", name: 모터 전류 }
  - { signal: suction_temp, prefix: TI, unit: "DEG C", name: 흡입 온도 }
  - { signal: discharge_temp, prefix: TI, unit: "DEG C", name: 토출 온도 }
  - { signal: speed, prefix: SI, unit: "rpm", name: 회전속도 }
  - { signal: shaft_vibration, prefix: VI, unit: "um pk-pk", name: 축 상대 진동 }
  - { signal: axial_position, prefix: ZI, unit: "mm", name: 축방향 위치 }
  - { signal: differential_pressure, prefix: PDI, unit: "mmH2O", name: 차압 }
  - { signal: oil_pressure, prefix: PI, unit: "kg/cm2(g)", name: 윤활유 압력 }
  - { signal: oil_temp, prefix: TI, unit: "DEG C", name: 윤활유 온도 }
  - { signal: process_temp, prefix: TI, unit: "DEG C", name: 공정 유체 온도 }
  - { signal: strainer_dp, prefix: PDI, unit: kPa, name: 흡입 스트레이너 차압 }   # 2026-11-27 추가 계측 (synthetic)
  - { signal: strainer_inlet_pressure, prefix: PI, unit: "kg/cm2(g)", name: 스트레이너 앞 흡입 압력 }   # 2026-11-27 추가 계측 (synthetic)
  - { signal: control_valve_position, prefix: ZI, unit: "%", name: 제어밸브 개도 }   # 2026-11-27 추가 계측 (synthetic)

# 정상 운전 공통 요인 (synthetic): 공정 그룹마다 평균 0 인 빠른 성분 하나를 아래 신호의 태그들이 나눠 갖는다.
# 태그 분산 중 share 만큼이 공통 요인이고, 부호는 그 신호가 부하와 같이(1)·반대로(-1) 움직이는지다.
# 평균은 μ 그대로라 Nelson 규칙과 충돌하지 않는다. 느린 부하·운전점 변화는 고장 모드(OP-LOAD-CHANGE)로만 넣는다.
correlation:
  share: 0.5
  signs: { flow: 1, current: 1, speed: 1, discharge_pressure: 1, differential_pressure: 1, suction_pressure: -1 }

# 공정 흐름 그래프 (프로젝트 가상 공장, 2026-11-20). 3D 뷰어 그래프(2026-11-19)에서 옮겼고 뷰어는 GET /{공장}/flow 로 읽는다.
# 간선 [from, to, label, stream]. stream 은 뷰어의 계통 구분 규칙을 옮긴 값이다. 축 연결은 driven_by 가 맡아 넣지 않는다.
flow:
  nodes:
    FEED: "Heavy hydrocarbon feed"
    MIX: "Feed + H2 mixer"
    FURN: "Charge heater"
    REACT: "Hydrocracking reactor"
    SEP: "High-pressure separator"
    STRIP: "Product stripper"
    FRAC: "Product fractionator"
    H2: "Fresh H2 supply"
    PURGE: "Gas purge / treatment"
    PRODUCT: "Naphtha / kerosene / diesel"
    GAS: Off-gas
    AIRC: "Combustion air"
    LUBE: "Lube oil reservoir"
    HX: "원료·반응 유출물 열교환기"
  edges:
    - [FEED, P-2101, feed, process]
    - [MIX, HX, "저온측", process]
    - [HX, FURN, "저온측", process]
    - [FURN, REACT, "heated feed", process]
    - [REACT, HX, "고온측", process]
    - [HX, SEP, "고온측", process]
    - [SEP, STRIP, "liquid product", process]
    - [SEP, PURGE, purge, utility]
    - [SEP, C-2301, "H2-rich recycle", utility]
    - [STRIP, FRAC, "stripped oil", process]
    - [STRIP, GAS, gas, utility]
    - [FRAC, PRODUCT, distillates, process]
    - [FRAC, P-2601, "overhead liquid", process]
    - [FRAC, P-2701, "unconverted oil", process]
    - [H2, C-2201, "make-up H2", utility]
    - [AIRC, FN-2401, "air / draft", utility]
    - [LUBE, P-2501, lubricant, utility]
    - [C-2201, MIX, H2, utility]
    - [C-2301, MIX, "recycle H2", utility]
    - [FN-2401, FURN, "combustion air", utility]
    - [P-2101, P-2101-S2, "stage 1 discharge", process]   # 가상 공장 추가 (PU-D5a)
    - [P-2101-S2, MIX, "pressurized feed", process]
    - [P-2501, C-2301, "lube oil", utility]
    - [P-2501, GB-2301, "lube oil", utility]   # 가상 공장 추가 (2026-11-26)
    - [P-2601, FRAC, reflux, process]
    - [P-2701, MIX, "UCO recycle", process]
    - [C-2201, C-2301, 보충 수소, utility]   # 가상 공장 추가 (뷰어에 없음)

equipment:
  # ---------------- UNIT-HOU-01 원료 가압·공급 ----------------
  - equip_id: P-2101
    name: "고압 원료 공급 펌프 (High Pressure Feed Pump)"
    type: PM
    unit_id: UNIT-HOU-01
    tags:
      - { tag_id: VI-2101A,
          signal: vibration,
          unit: "mm/s RMS",
          description: "펌프 구동측 진동",
          limits: { warn_hi: 3.5, alarm_hi: 4.5, trip_hi: 7.1 },
          normal_ref: "2.1",
          limit_basis: "원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 1,
          decimals: 3,
          seed_key: hou-r001,
          control: { mean: 2.132, sigma: 0.10589142125775654 } }
      - { tag_id: VI-2101B,
          signal: vibration,
          unit: "mm/s RMS",
          description: "펌프 반구동측 진동",
          limits: { warn_hi: 3.5, alarm_hi: 4.5, trip_hi: 7.1 },
          normal_ref: "1.7",
          limit_basis: "원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 1,
          decimals: 3,
          seed_key: hou-r002,
          control: { mean: 1.739, sigma: 0.08023931197239917 } }
      - { tag_id: TI-2101A,
          signal: bearing_temp,
          unit: "DEG C",
          description: "펌프 구동측 베어링 온도",
          limits: { warn_hi: 80, alarm_hi: 90, trip_hi: 100 },
          normal_ref: "68",
          limit_basis: "원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 10,
          decimals: 2,
          seed_key: hou-r003,
          control: { mean: 67.685, sigma: 0.6015978203916633 } }
      - { tag_id: TI-2101B,
          signal: bearing_temp,
          unit: "DEG C",
          description: "펌프 반구동측 베어링 온도",
          limits: { warn_hi: 80, alarm_hi: 90, trip_hi: 100 },
          normal_ref: "63",
          limit_basis: "원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 10,
          decimals: 2,
          seed_key: hou-r004,
          control: { mean: 62.12, sigma: 0.43055568750743833 } }
      - { tag_id: PI-2101A,
          signal: suction_pressure,
          unit: "kg/cm2(g)",
          description: "펌프 흡입압력",
          limits: { alarm_lo: 4.5, alarm_hi: 9, trip_lo: 3.5 },
          normal_ref: "6.5",
          limit_basis: "원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 1,
          decimals: 3,
          seed_key: hou-r005,
          control: { mean: 6.717, sigma: 0.15806315316415284 } }
      - { tag_id: PI-2101B,
          signal: discharge_pressure,
          unit: "kg/cm2(g)",
          description: "1단 토출 압력 (2단으로 가는 중간 압력)",
          limits: { alarm_lo: 88.1, alarm_hi: 103, trip_hi: 106 },
          normal_ref: "96",
          limit_basis: "1단 토출 = 중간 압력 (synthetic 2026-11-25 PU-D5a: 두 대 직렬, 같은 곡선 두 단). 이전 한계/이전 μ 비율 × 새 μ, 유효숫자 3자리",
          interval_sec: 1,
          decimals: 2,
          seed_key: hou-r006,
          control: { mean: 95.8984, sigma: 0.4029437192712044 } }
      - { tag_id: FI-2101,
          signal: flow,
          unit: "m3/h",
          description: "펌프 토출 유량",
          limits: { alarm_lo: 130, alarm_hi: 215, trip_lo: 100 },
          normal_ref: "182",
          limit_basis: "원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 1,
          decimals: 2,
          seed_key: hou-r007,
          control: { mean: 185.41, sigma: 1.934831324815192 } }
      - { tag_id: II-2101,
          signal: current,
          unit: "A",
          description: "모터 전류",
          limits: { alarm_hi: 97.5, trip_hi: 105 },
          normal_ref: "86",
          limit_basis: "단 축동력 (synthetic 2026-11-25 PU-D5a: 두 대 직렬, 같은 곡선 두 단). 이전 한계/이전 μ 비율 × 새 μ, 유효숫자 3자리",
          interval_sec: 1,
          decimals: 2,
          seed_key: hou-r008,
          derive: { formula: power, terms: [{ tag: FI-2101, exp: 1 }, { tag: PI-2101B, minus: PI-2101A, exp: 1 }], noise_sigma: 0.806746 },
          control: { mean: 85.8938, sigma: 1.01884 } }
      - { tag_id: PDI-2101-STR,
          signal: strainer_dp,
          unit: kPa,
          description: "흡입 스트레이너 차압 (2026-11-27 추가 계측, synthetic)",
          limits: { warn_hi: 40, alarm_hi: 80 },
          limit_basis: "가정값: 깨끗한 스트레이너 차압 5 kPa, 경고 40·경보 80 kPa(고압 구간이라 약한 막힘 차압의 약 2배로 둠). 실제 설정값 아님",
          interval_sec: 1,
          decimals: 3,
          seed_key: hou-str-dp,
          control: { mean: 5.0, sigma: 0.25 } }
      - { tag_id: PI-2101-STR,
          signal: strainer_inlet_pressure,
          unit: "kg/cm2(g)",
          description: "스트레이너 앞 흡입 압력 (2026-11-27 추가 계측, synthetic)",
          limits: { trip_lo: 3.5, alarm_lo: 4.5, alarm_hi: 9.0 },
          limit_basis: "가정값: 같은 설비 흡입 압력(PI-2101A)과 같은 한계",
          interval_sec: 1,
          decimals: 4,
          seed_key: hou-str-pi,
          control: { mean: 6.767986, sigma: 0.1581 } }
      - { tag_id: SI-2101,
          signal: speed,
          unit: rpm,
          description: "펌프 회전속도 (2026-11-27 추가 계측, synthetic)",
          limits: { alarm_lo: 3222, warn_lo: 3401 },
          limit_basis: "가정값: 정격 회전수의 95 %·90 %. 실제 설정값 아님",
          interval_sec: 1,
          decimals: 1,
          seed_key: hou-2101-spd,
          control: { mean: 3580.0, sigma: 1.5 } }
      - { tag_id: PI-2101B-D2,
          signal: redundant_discharge_pressure,
          unit: "kg/cm2(g)",
          description: "토출 압력 이중화 전송기 (2026-11-27 추가 계측, synthetic)",
          limits: { alarm_hi: 103.0, trip_hi: 106.0, alarm_lo: 88.1 },
          limit_basis: "가정값: PI-2101B 와 같은 한계",
          interval_sec: 1,
          decimals: 2,
          seed_key: hou-r006-d2,
          control: { mean: 95.8984, sigma: 0.4029437192712044 } }
  # 합성 추가 (2026-11-25 PU-D5a): 자료에 없는 두 번째 펌프(P-2101 와 직렬 2단). 태그·단위·주기·잡음은 P-2101 를 본떴고 개별 잡음은 seed_key 로 독립이다
  - equip_id: P-2101-S2
    name: "고압 원료 공급 펌프 2단 (High Pressure Feed Pump Stage 2, 합성 가정)"
    type: PM
    unit_id: UNIT-HOU-01
    tags:
      - { tag_id: VI-2101S2A,
          signal: vibration,
          unit: "mm/s RMS",
          description: "펌프 구동측 진동",
          limits: { warn_hi: 3.5, alarm_hi: 4.5, trip_hi: 7.1 },
          normal_ref: "2.1",
          limit_basis: "P-2101 를 본뜬 합성 설비: 원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 1,
          decimals: 3,
          seed_key: hou-r101,
          control: { mean: 2.132, sigma: 0.10589142125775654 } }
      - { tag_id: VI-2101S2B,
          signal: vibration,
          unit: "mm/s RMS",
          description: "펌프 반구동측 진동",
          limits: { warn_hi: 3.5, alarm_hi: 4.5, trip_hi: 7.1 },
          normal_ref: "1.7",
          limit_basis: "P-2101 를 본뜬 합성 설비: 원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 1,
          decimals: 3,
          seed_key: hou-r102,
          control: { mean: 1.739, sigma: 0.08023931197239917 } }
      - { tag_id: TI-2101S2A,
          signal: bearing_temp,
          unit: "DEG C",
          description: "펌프 구동측 베어링 온도",
          limits: { warn_hi: 80, alarm_hi: 90, trip_hi: 100 },
          normal_ref: "68",
          limit_basis: "P-2101 를 본뜬 합성 설비: 원 자료의 [예시] 한계값. 공개 자료의 일반 범위를 참고한 가정값이며 실제 설정값 아님",
          interval_sec: 10,
          decimals: 2,
          seed_key: hou-r103,
          control: { mean: 67.685, sigma: 0.6015978203916633 } }
      - { tag_id: TI-2101S2B,
          signal: bearing_temp,
          unit: "DEG C",
          description: "펌프 반구동측 베어링 온도",
          limits: { warn_hi: 80, alarm_hi: 90, trip_hi: 100 },
          normal_ref: "63",
