# 구성안: HOU (수첨분해) (PL-HOU) — 다중 공장 설계 docs/superpowers/specs/2026-11-09-multi-plant-design.md
# - 출처: hou-plant-sample/data/HOU_*.xlsx 의 `설비 설명`(계층)·`설비 태그`(태그명·설명·단위·정상 기준·경고/알람/정지 상·하한·근거) 시트. 마스터 값은 그대로.
# - 태그명은 같은 설비 안에서만 고유하다 (복합키 (equip_id, tag_id)). 한계값·정상 기준·근거는 자료 그대로이며 빈 칸은 적지 않았다.
# - decimals 는 데이터의 소수 자릿수.
# - 온도 10초, 나머지 1초. seed_key 는 공장 접두어를 붙여 다른 공장과 겹치지 않는다.

plant:
  plant_id: PL-HOU
  name: "HOU (수첨분해)"
  config_version: 2
  unit_groups:
    - id: UG-HOU-01
      name: "원료 공급"
      units:
        - { id: UNIT-HOU-01, name: "원료 가압·공급" }
    - id: UG-HOU-02
      name: "수소 공급"
      units:
        - { id: UNIT-HOU-02, name: "보충 수소 압축" }
    - id: UG-HOU-03
      name: "수첨반응"
      units:
        - { id: UNIT-HOU-03, name: "수소 순환" }
        - { id: UNIT-HOU-04, name: "반응기 가열" }
    - id: UG-HOU-04
      name: "기액 분리·순환"
      units:
        - { id: UNIT-HOU-05, name: "압축기 지원" }
    - id: UG-HOU-05
      name: "생성물 분별"
      units:
        - { id: UNIT-HOU-06, name: "분별탑 환류" }
        - { id: UNIT-HOU-07, name: "미전환유 순환" }

# 설비 유형 매핑. kind 는 기계 종류 (참고)
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: CC, name: 압축기, prefix: C, kind: compressor }
  - { type: FN, name: 팬, prefix: F, kind: fan }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: "mm/s RMS", name: 케이싱 진동 속도 }
  - { signal: bearing_temp, prefix: TI, unit: "DEG C", name: 베어링 온도 }
  - { signal: suction_pressure, prefix: PI, unit: "kg/cm2(g)", name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PI, unit: "kg/cm2(g)", name: 토출 압력 }
  - { signal: flow, prefix: FI, unit: "m3/h", name: 유량 }
  - { signal: current, prefix: II, unit: "A", name: 모터 전류 }
  - { signal: suction_temp, prefix: TI, unit: "DEG C", name: 흡입 온도 }
  - { signal: discharge_temp, prefix: TI, unit: "DEG C", name: 토출 온도 }
  - { signal: speed, prefix: SI, unit: "rpm", name: 회전속도 }
  - { signal: shaft_vibration, prefix: VI, unit: "um pk-pk", name: 축 상대 진동 }
  - { signal: axial_position, prefix: ZI, unit: "mm", name: 축방향 위치 }
  - { signal: differential_pressure, prefix: PDI, unit: "mmH2O", name: 차압 }
  - { signal: oil_pressure, prefix: PI, unit: "kg/cm2(g)", name: 윤활유 압력 }
  - { signal: oil_temp, prefix: TI, unit: "DEG C", name: 윤활유 온도 }
  - { signal: process_temp, prefix: TI, unit: "DEG C", name: 공정 유체 온도 }

