# 구성안 1: 가상 수첨탈황 공장 (기획서 3장, 4.1)
# - 설비 ID: {유형 접두어}-{Unit 번호}{일련번호 3자리}, 태그 ID: {신호 접두어}-{설비 ID 하이픈 제거}
# - ID는 이 파일에만 정의한다. 코드는 ID 형식을 해석하지 않는다.
# - seed_key: 태그별 시드용 고정 키. ID를 바꿔도 생성 값·골든셋 정답이 유지된다.
# - limits: 시뮬레이터는 정상값을 warn_hi 아래에 두고, 수집 서버는 같은 값으로 알람을 판정한다.

plant:
  plant_id: PL-HDS
  name: 가상 수첨탈황 공장
  config_version: 1
  unit_groups:
    - id: UG-RX
      name: 수첨 반응 계열
      units:
        - { id: U-1, name: 등유 수첨 공정 }
        - { id: U-2, name: 경유 수첨 공정 }
    - id: UG-H2
      name: 수소·가스 처리 계열
      units:
        - { id: U-3, name: 보충 수소 압축 }
        - { id: U-4, name: 오프가스 회수 }
    - id: UG-UT
      name: 분리·유틸리티 계열
      units:
        - { id: U-5, name: 제품 스트리퍼 }
        - { id: U-6, name: 계장공기 }

# 설비 유형 매핑 (요구사항 정의서 M-2: CC 4, RC 2, PM 6, MT 3, FN 2, ST 2, GB 1)
equipment_types:
  - { type: CC, name: 원심 압축기, prefix: C }
  - { type: RC, name: 왕복동 압축기, prefix: K }
  - { type: PM, name: 펌프, prefix: P }
  - { type: MT, name: 모터, prefix: M }
  - { type: FN, name: 팬, prefix: F }
  - { type: ST, name: 스팀 터빈, prefix: ST }
  - { type: GB, name: 기어박스, prefix: G }

# 표준 태그 (신호 접두어·단위)
signals:
  - { signal: vibration, prefix: VI, unit: mm/s, name: 진동 }
  - { signal: temperature, prefix: TI, unit: "°C", name: 온도 }
  - { signal: pressure, prefix: PI, unit: kg/cm2, name: 압력 }

