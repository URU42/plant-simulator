          control: { mean: 590.0, sigma: 0.25673012683495405 } }
  - equip_id: C-3102
    name: "보충 수소 압축기 (Make-up Hydrogen Compressor)"
    type: CC
    unit_id: UNIT-RHDS-02
    driven_by: M-3102
    tags:
      - { tag_id: VI-A-C3102,
          signal: vibration,
          unit: "mm/s RMS",
          description: "프레임 케이싱 진동",
          limits: { warn_hi: 6, alarm_hi: 7.1, trip_hi: 11 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람·정지=경고 위 ISO 20816 영역 경계 두 개",
          interval_sec: 1,
          decimals: 3,
          seed_key: rhds-r007,
          control: { mean: 2.31, sigma: 0.0641178283959296 } }
      - { tag_id: TI-B-C3102,
          signal: bearing_temp,
          unit: "DEG C",
          description: "프레임 베어링 온도",
          limits: { warn_hi: 85, alarm_hi: 95, trip_hi: 105 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 +10, 정지 +20",
          interval_sec: 10,
          decimals: 2,
          seed_key: rhds-r008,
          control: { mean: 61.2, sigma: 0.12752995290867422 } }
      - { tag_id: PI-S-C3102,
          signal: suction_pressure,
          unit: "bar(g)",
          description: "첫 단 흡입 압력",
          limits: { warn_lo: 20, alarm_lo: 16, trip_lo: 12.8 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 ×0.8, 정지 = 알람 ×0.8",
          interval_sec: 1,
          decimals: 3,
          seed_key: rhds-r009,
          control: { mean: 24.99, sigma: 0.03653983746847026 } }
      - { tag_id: PI-D-C3102,
          signal: discharge_pressure,
          unit: "bar(g)",
          description: "최종 단 토출 압력",
          limits: { warn_hi: 175, alarm_hi: 184, trip_hi: 193 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 ×1.05, 정지 ×1.10",
