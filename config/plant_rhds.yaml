# 구성안: RHDS (상압 잔사유 수첨탈황) (PL-RHDS) — 다중 공장 설계 docs/superpowers/specs/2026-11-09-multi-plant-design.md
# - 출처: RHDS_VRDS_v3/data/RHDS_*.xlsx 의 `설비 설명`(계층)·`설비 태그`(태그명·설명·단위·정상 기준·경고/알람/정지 상·하한·근거) 시트. 마스터 값은 그대로.
# - 태그명은 자료의 이름에 설비 종류 문자를 넣어 공장 안에서 고유하게 바꿨다 (P-3101 의 TI-B-3101 → TI-B-P3101). 키는 그대로 (equip_id, tag_id). 한계값·정상 기준·근거는 자료 그대로이며 빈 칸은 적지 않았다.
# - 알람·정지값은 자료에 없어 CDU·HOU 의 같은 신호 경고→알람→정지 간격을 경고값에 적용했다 (규칙은 limit_basis). 유효숫자 3자리.
# - decimals 는 데이터의 소수 자릿수.
# - 온도 10초, 나머지 1초. seed_key 는 공장 접두어를 붙여 다른 공장과 겹치지 않는다.
# - 합성 추가 (2026-11-18): 시나리오의 전동기·기어박스 구성을 위해 자료에 없는 M-3101·GB-3101·M-3102 를 넣었다. 한계값은 없고 μ·σ 는 합성값이다. 피구동 압축기의 회전속도 μ·σ 와 비율을 맞춰 driven_by 로 속도를 공유한다.

# - 같은 설비 안 관계 (2026-11-19, synthetic): derive 가 있는 태그는 매 표본 그 시각 같은 설비 태그로 계산한다 — 펌프 전류 ∝ 유량 × 양정,
#   팬 전류 ∝ 유량³·차압 ∝ 유량², 압축기 토출 온도(K) ∝ 흡입 온도(K) × 압축비^m (m 은 자료 μ 로 맞춤), 베어링 온도(K) ∝ 윤활유 온도(K).
#   식이 정하는 변동을 그대로 쓴다(물리식 우선, 사용자 확정). μ 는 자료 그대로, σ 는 식만의 변동이 자료 σ 를 넘으면 정상 생성값으로 바꿨다
#   (자체 잡음 = 자료 σ × 0.3). 자료 σ 이하면 자료 σ 에 맞게 자체 잡음으로 채웠다. RFCC 의 μ±3σ 경고 한계는 새 σ 로 다시 계산했다.
plant:
  plant_id: PL-RHDS
  name: "RHDS (상압 잔사유 수첨탈황)"
  config_version: 7
  unit_groups:
    - id: UG-RHDS-01
      name: "원료 공급"
      units:
        - { id: UNIT-RHDS-01, name: "잔사유 가압·공급" }
    - id: UG-RHDS-02
      name: "수소 공급"
      units:
        - { id: UNIT-RHDS-02, name: "보충 수소 압축" }
    - id: UG-RHDS-03
      name: "수첨탈황 반응"
      units:
        - { id: UNIT-RHDS-03, name: "수소 순환" }
    - id: UG-RHDS-04
      name: "반응 가열"
      units:
        - { id: UNIT-RHDS-04, name: "연소공기 공급" }
    - id: UG-RHDS-05
      name: "고온 유체 처리"
      units:
        - { id: UNIT-RHDS-05, name: "잔사유 이송" }
    - id: UG-RHDS-06
      name: "생성물 분별"
      units:
        - { id: UNIT-RHDS-06, name: "환류·순환" }

# 설비 유형 매핑. kind 는 기계 종류 (참고)
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: CC, name: 압축기, prefix: C, kind: compressor }
  - { type: FN, name: 팬, prefix: F, kind: fan }
  - { type: MT, name: 전동기, prefix: M, kind: motor }
  - { type: GB, name: 기어박스, prefix: GB, kind: gearbox }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: "mm/s RMS", name: 케이싱 진동 속도 }
  - { signal: bearing_temp, prefix: TI, unit: "DEG C", name: 베어링 온도 }
  - { signal: suction_pressure, prefix: PI, unit: "bar(g)", name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PI, unit: "bar(g)", name: 토출 압력 }
  - { signal: interstage_pressure, prefix: PI, unit: "bar(g)", name: 단간 압력 }
  - { signal: flow, prefix: FI, unit: "m3/h", name: 유량 }
  - { signal: current, prefix: II, unit: "A", name: 모터 전류 }
  - { signal: suction_temp, prefix: TI, unit: "DEG C", name: 흡입 온도 }
  - { signal: discharge_temp, prefix: TI, unit: "DEG C", name: 토출 온도 }
  - { signal: speed, prefix: SI, unit: "rpm", name: 회전속도 }
  - { signal: shaft_vibration, prefix: XI, unit: "um pk-pk", name: 축 상대 진동 }
  - { signal: axial_position, prefix: ZI, unit: "mm", name: 축방향 위치 }
  - { signal: oil_pressure, prefix: PI, unit: "bar(g)", name: 윤활유 압력 }
  - { signal: oil_temp, prefix: TI, unit: "DEG C", name: 윤활유 온도 }
  - { signal: differential_pressure, prefix: PDI, unit: "Pa", name: 차압 }
  - { signal: process_temp, prefix: TI, unit: "DEG C", name: 공정 유체 온도 }

# 정상 운전 공통 요인 (synthetic): 공정 그룹마다 평균 0 인 빠른 성분 하나를 아래 신호의 태그들이 나눠 갖는다.
# 태그 분산 중 share 만큼이 공통 요인이고, 부호는 그 신호가 부하와 같이(1)·반대로(-1) 움직이는지다.
# 평균은 μ 그대로라 Nelson 규칙과 충돌하지 않는다. 느린 부하·운전점 변화는 고장 모드(OP-LOAD-CHANGE)로만 넣는다.
correlation:
  share: 0.5
  signs: { flow: 1, current: 1, speed: 1, discharge_pressure: 1, differential_pressure: 1, suction_pressure: -1 }

equipment:
  # ---------------- UNIT-RHDS-01 잔사유 가압·공급 ----------------
  - equip_id: P-3101
    name: "고압 원료 공급 펌프 (High Pressure Feed Pump)"
    type: PM
    unit_id: UNIT-RHDS-01
    tags:
      - { tag_id: VI-A-P3101,
          signal: vibration,
          unit: "mm/s RMS",
          description: "구동측 수평 케이싱 진동",
          limits: { warn_hi: 4.5, alarm_hi: 7.1, trip_hi: 11 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람·정지=경고 위 ISO 20816 영역 경계 두 개",
          interval_sec: 1,
          decimals: 3,
          seed_key: rhds-r001,
          control: { mean: 1.65, sigma: 0.04614035877985053 } }
      - { tag_id: TI-B-P3101,
          signal: bearing_temp,
          unit: "DEG C",
          description: "구동측 베어링 온도",
          limits: { warn_hi: 85, alarm_hi: 95, trip_hi: 105 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 +10, 정지 +20",
          interval_sec: 10,
          decimals: 2,
          seed_key: rhds-r002,
          control: { mean: 63.2, sigma: 0.1278861255614184 } }
      - { tag_id: PI-S-P3101,
          signal: suction_pressure,
          unit: "bar(g)",
          description: "흡입 압력",
          limits: { warn_lo: 3.5, alarm_lo: 2.8, trip_lo: 2.24 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 ×0.8, 정지 = 알람 ×0.8",
          interval_sec: 1,
          decimals: 3,
          seed_key: rhds-r003,
          control: { mean: 5.2, sigma: 0.01737220001419893 } }
      - { tag_id: PI-D-P3101,
          signal: discharge_pressure,
          unit: "bar(g)",
          description: "토출 압력",
          limits: { warn_hi: 170, alarm_hi: 178, trip_hi: 187 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 ×1.05, 정지 ×1.10",
          interval_sec: 1,
          decimals: 2,
          seed_key: rhds-r004,
          control: { mean: 155.07, sigma: 0.1293802468071882 } }
      - { tag_id: FI-P3101,
          signal: flow,
          unit: "m3/h",
          description: "원료 유량",
          limits: { warn_lo: 160, alarm_lo: 138, trip_lo: 110 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 ×0.86, 정지 = 알람 ×0.8",
          interval_sec: 1,
          decimals: 1,
          seed_key: rhds-r005,
          control: { mean: 211.5, sigma: 1.1501088461640019 } }
      - { tag_id: II-P3101,
          signal: current,
          unit: "A",
          description: "모터 전류",
          limits: { warn_hi: 210, alarm_hi: 223, trip_hi: 240 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 ×1.06, 정지 = 알람 ×1.08",
          interval_sec: 1,
          decimals: 2,
          seed_key: rhds-r006,
          derive: { formula: power, terms: [{ tag: FI-P3101, exp: 1 }, { tag: PI-D-P3101, minus: PI-S-P3101, exp: 1 }], noise_sigma: 0.180929 },
          control: { mean: 165.8, sigma: 0.993796 } }
  # ---------------- UNIT-RHDS-02 보충 수소 압축 ----------------
  # 합성 추가 (2026-11-18): 자료에 없는 구동 전동기(C-3102 직결). 한계값 없음, μ·σ 는 합성값. 회전속도는 C-3102 와 같다
  - equip_id: M-3102
    name: "보충 수소 압축기 구동 전동기 (Make-up Hydrogen Compressor Motor)"
    type: MT
    unit_id: UNIT-RHDS-02
    tags:
      - { tag_id: VI-A-M3102,
          signal: vibration,
          unit: "mm/s RMS",
          description: "구동측 케이싱 진동",
          interval_sec: 1,
          decimals: 3,
          seed_key: rhds-r044,
          control: { mean: 1.5, sigma: 0.04 } }
      - { tag_id: TI-B-M3102,
          signal: bearing_temp,
          unit: "DEG C",
          description: "구동측 베어링 온도",
          interval_sec: 10,
          decimals: 2,
          seed_key: rhds-r045,
          control: { mean: 65.0, sigma: 0.18 } }
      - { tag_id: II-M3102,
          signal: current,
          unit: "A",
          description: "전동기 전류",
          interval_sec: 1,
          decimals: 2,
          seed_key: rhds-r046,
          control: { mean: 210.0, sigma: 0.6 } }
      - { tag_id: SI-M3102,
          signal: speed,
          unit: "rpm",
          description: "전동기 회전속도",
          interval_sec: 1,
          decimals: 2,
