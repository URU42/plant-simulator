          interval_sec: 10,
          decimals: 3,
          seed_key: rhds-r011,
          control: { mean: 36.3, sigma: 0.08881898292817154 } }
      - { tag_id: TI-D-C3102,
          signal: discharge_temp,
          unit: "DEG C",
          description: "최종 단 토출 가스 온도",
          limits: { warn_hi: 145, alarm_hi: 155, trip_hi: 165 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 +10, 정지 +20",
          interval_sec: 10,
          decimals: 2,
          seed_key: rhds-r012,
          derive: { formula: power, out_offset: 273.15, terms: [{ tag: TI-S-C3102, offset: 273.15, exp: 1 }, { tag: PI-D-C3102, offset: 1.01325, exp: 0.1285 }, { tag: PI-S-C3102, offset: 1.01325, exp: -0.1285 }], noise_sigma: 0.193198 },
          control: { mean: 117.4, sigma: 0.2437323909435544 } }
      - { tag_id: FI-C3102,
          signal: flow,
          unit: "Nm3/h",
          description: "보충 수소 표준 유량",
          limits: { warn_lo: 9000, alarm_lo: 7740, trip_lo: 6190 },
          limit_basis: "원 자료의 '주의' 한계(합성 개발 설정, OEM·보호 기준 아님)를 경고 칸에 옮김. 알람·정지는 CDU·HOU 의 같은 신호 간격 적용: 알람 ×0.86, 정지 = 알람 ×0.8",
          interval_sec: 1,
          decimals: 0,
          seed_key: rhds-r013,
          control: { mean: 12087.0, sigma: 68.19476820414206 } }
      - { tag_id: SI-C3102,
          signal: speed,
          unit: "rpm",
          description: "크랭크축 회전속도",
          limits: { warn_lo: 570, alarm_lo: 547, warn_hi: 610, alarm_hi: 634, trip_hi: 659 },
