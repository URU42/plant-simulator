# RHDS 개발용 시나리오 (다중 공장 설계 §4.6). 출처: RHDS_VRDS_v3/평가전용/생성-사건표.json (SIM-DEV-001, FI-3103 Scan Off). 매주 반복.
# 크기는 자료에 숫자가 없어 설계에서 정한 값이다. 태그명이 설비 사이에서 겹치므로 equip_id 를 반드시 적는다.
events:
  # 고압 원료 공급 펌프 일시적 흡입 조건 악화 (64000초, 40분): 진동 증가, 흡입/토출 압력·유량 감소 후 회복
  - event_id: EV-RHDS-001
    equip_id: P-3101
    tag_id: VI-A-3101
    pattern: swell
    start: 2026-11-01T17:46:40+09:00
    duration: 40m
    repeat_every: 7d
    magnitude: 1.5
    related:
      - { equip_id: P-3101, tag_id: PI-S-3101, ratio: -0.667 }     # −1.0 / 1.5
      - { equip_id: P-3101, tag_id: PI-D-3101, ratio: -2.0 }       # −3.0 / 1.5
      - { equip_id: P-3101, tag_id: FI-3101, ratio: -13.33 }       # −20 / 1.5
    description: 일시적 흡입 조건 악화와 유동 불안정. 손상·정지 미주입

  # 분별탑 환류 펌프 유량 Scan Off 120초 (90000초)
  - event_id: EV-RHDS-002
    equip_id: P-3103
    tag_id: FI-3103
    pattern: quality
    quality: ScanOff
    start: 2026-11-02T01:00:00+09:00
