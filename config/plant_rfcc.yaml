      - { tag_id: TI-E-1202, signal: bearing_temp, unit: degC, description: "저널 베어링 온도",
          interval_sec: 10, decimals: 4, seed_key: r017, normal: { base: 82, noise_sd: 0.035 } }
      - { tag_id: ZI-E-1202, signal: axial_position, unit: mm, description: "축방향 상대 위치",
          interval_sec: 1, decimals: 5, seed_key: r018, normal: { base: 0.04, noise_sd: 0.0008 } }
      - { tag_id: SI-E-1202, signal: speed, unit: rpm, description: "축 회전속도",
