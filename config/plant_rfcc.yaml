    type: ST
    unit_id: UNIT-RFCC-06
    # 시작 운전점. 주석을 풀면 설계 회전속도(SI-T-1401 μ 8197.84 rpm) 대비 비 r 로 이 터빈과 피구동 C-1401 의
    # 태그 μ 가 바뀐다 (유량 r, 진동 r², 양정 r², 전류 r³ — 상사 법칙 근사). 실행 중 바꾸려면 고장 모드 OP-LOAD-CHANGE 를 쓴다.
