          interval_sec: 10, decimals: 4, seed_key: r009, control: { mean: 76.98085, sigma: 0.18529889308277228 } }
      - { tag_id: PS-B-1201, signal: suction_pressure, unit: bar(g), description: "입구 공기 압력",
          limits: { trip_lo: -0.1, alarm_lo: -0.08, warn_lo: -0.05 }, limit_basis: "주 공기 송풍기 입구(대기 흡입) — 입구 필터 막힘 저압 −0.05/−0.08/−0.10 bar(g) (AI 결정, synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
