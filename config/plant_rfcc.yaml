# 구성안 2: RFCC 회전기계 (설계 docs/superpowers/specs/2026-11-09-rfcc-simulator-design.md)
# - 출처: rfcc-20261109 v1.2.0 의 support/config.json. 설비 12대, 태그 81개, 기준값·잡음은 그대로.
# - 온도(bearing_temp / suction_temp / discharge_temp / oil_temp) 16개는 10초, 나머지 65개는 1초 주기.
# - 한계값은 자료에 없어 통계로 정했다 (경고만, 상·하한). 자료(이벤트 두 건 + 2시간, Bad 제외)의 10분 구간 최대값의 평균 + 3σ 를 상한,
#   최소값의 평균 − 3σ 를 하한으로 했다. 알람이 10분 최대·최소를 보므로 원시 값의 σ 로는 정상에서도 구간의 17% 가 넘는다.
#   잡음만으로 넘는 구간이 약 0.2% 라 delay_samples 2 (20분 연속)로 둔다. 매뉴얼의 정상 중심값은 그대로 경보값으로 쓰지 않았다.
# - driven_by: 같은 축으로 직접 결합된 설비. 피구동 설비의 speed 태그는 구동기의 속도를 그대로 쓴다.
# - seed_key: 태그 r001~r081, 설비 e01~e12. ID 를 바꿔도 생성 값이 유지된다.

plant:
  plant_id: PL-RFCC
  name: 가상 정유단지 RFCC
  config_version: 2
  signal_model: rfcc
  unit_groups:
    - id: UG-RFCC-01
      name: 원료 공급
      units:
        - { id: UNIT-RFCC-01, name: 원료 공급 }
    - id: UG-RFCC-02
      name: 반응·재생
      units:
        - { id: UNIT-RFCC-02, name: 촉매 재생 }
        - { id: UNIT-RFCC-03, name: 동력 회수 }
    - id: UG-RFCC-03
      name: 주분별
      units:
        - { id: UNIT-RFCC-04, name: 슬러리·LCO 순환·탑정 처리 }
    - id: UG-RFCC-04
      name: 가스 압축·회수
      units:
        - { id: UNIT-RFCC-05, name: 습가스 압축 }
        - { id: UNIT-RFCC-06, name: 습가스 압축 구동 }
        - { id: UNIT-RFCC-07, name: 흡수·분별·안정화 }
    - id: UG-RFCC-05
      name: 제품 처리
      units:
        - { id: UNIT-RFCC-08, name: LPG·가솔린 처리 }

# 설비 유형 매핑. kind 는 신호 모델이 식을 고를 때 보는 기계 종류
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: BL, name: 송풍기, prefix: B, kind: blower }
  - { type: EX, name: 팽창 터빈, prefix: E, kind: expander }
  - { type: CC, name: 원심 압축기, prefix: C, kind: compressor }
  - { type: ST, name: 증기 터빈, prefix: T, kind: turbine }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: mm/s RMS, name: 케이싱 진동 속도 }
  - { signal: shaft_vibration, prefix: VX, unit: um p-p, name: 축 상대 진동 }
  - { signal: bearing_temp, prefix: TI, unit: degC, name: 베어링 온도 }
  - { signal: suction_temp, prefix: TS, unit: degC, name: 흡입 온도 }
  - { signal: discharge_temp, prefix: TD, unit: degC, name: 토출 온도 }
  - { signal: oil_temp, prefix: LOT, unit: degC, name: 윤활유 공급 온도 }
  - { signal: suction_pressure, prefix: PS, unit: bar(g), name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PD, unit: bar(g), name: 토출 압력 }
  - { signal: oil_pressure, prefix: LOP, unit: bar(g), name: 윤활유 공급 압력 }
  - { signal: steam_pressure, prefix: SP, unit: bar(g), name: 입구 증기 압력 }
  - { signal: flow, prefix: FI, unit: m3/h, name: 유량 }
  - { signal: current, prefix: II, unit: A, name: 모터 전류 }
  - { signal: speed, prefix: SI, unit: rpm, name: 축 회전속도 }
  - { signal: axial_position, prefix: ZI, unit: mm, name: 축방향 상대 위치 }

equipment:
  # ---------------- UNIT-RFCC-01 원료 공급 ----------------
  - equip_id: P-1101A
    name: Feed Charge Pump
    type: PM
    unit_id: UNIT-RFCC-01
    seed_key: e01
    tags:
      - { tag_id: VI-P-1101A, signal: vibration, unit: mm/s RMS, description: "펌프 구동측 케이싱 진동 속도 Overall RMS",
          limits: { warn_lo: 1.2567, warn_hi: 1.6451 }, delay_samples: 2, limit_basis: "통계 기준: 정상 구간 10분 최대·최소의 평균 ± 3σ",
          interval_sec: 1, decimals: 4, seed_key: r001, normal: { base: 1.45, noise_sd: 0.03375 } }
      - { tag_id: TI-P-1101A, signal: bearing_temp, unit: degC, description: "펌프 구동측 베어링 온도",
