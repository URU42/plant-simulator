# 구성안 2: RFCC 회전기계 (설계 docs/superpowers/specs/2026-11-09-rfcc-simulator-design.md)
# - 출처: rfcc-20261109 v1.2.0 의 support/config.json. 설비 12대, 태그 81개, 기준값·잡음은 그대로.
# - 온도(bearing_temp / suction_temp / discharge_temp / oil_temp) 16개는 10초, 나머지 65개는 1초 주기.
# - 한계값(limits)은 없다. 자료의 매뉴얼이 "정상 중심값을 경보값으로 바꾸지 않는다"고 못 박았다. 알람 배치는 이 태그들을 건너뛴다.
# - driven_by: 같은 축으로 직접 결합된 설비. 피구동 설비의 speed 태그는 구동기의 속도를 그대로 쓴다.
# - seed_key: 태그 r001~r081, 설비 e01~e12. ID 를 바꿔도 생성 값이 유지된다.

plant:
  plant_id: PL-RFCC
  name: 가상 정유단지 RFCC
  config_version: 1
  signal_model: rfcc
  unit_groups:
    - id: UG-RFCC-01
      name: 원료 공급
      units:
        - { id: UNIT-RFCC-01, name: 원료 공급 }
    - id: UG-RFCC-02
      name: 반응·재생
      units:
        - { id: UNIT-RFCC-02, name: 촉매 재생 }
        - { id: UNIT-RFCC-03, name: 동력 회수 }
    - id: UG-RFCC-03
      name: 주분별
      units:
        - { id: UNIT-RFCC-04, name: 슬러리·LCO 순환·탑정 처리 }
    - id: UG-RFCC-04
      name: 가스 압축·회수
      units:
        - { id: UNIT-RFCC-05, name: 습가스 압축 }
        - { id: UNIT-RFCC-06, name: 습가스 압축 구동 }
        - { id: UNIT-RFCC-07, name: 흡수·분별·안정화 }
    - id: UG-RFCC-05
      name: 제품 처리
      units:
        - { id: UNIT-RFCC-08, name: LPG·가솔린 처리 }

# 설비 유형 매핑. kind 는 신호 모델이 식을 고를 때 보는 기계 종류
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: BL, name: 송풍기, prefix: B, kind: blower }
  - { type: EX, name: 팽창 터빈, prefix: E, kind: expander }
  - { type: CC, name: 원심 압축기, prefix: C, kind: compressor }
  - { type: ST, name: 증기 터빈, prefix: T, kind: turbine }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: mm/s RMS, name: 케이싱 진동 속도 }
  - { signal: shaft_vibration, prefix: VX, unit: um p-p, name: 축 상대 진동 }
  - { signal: bearing_temp, prefix: TI, unit: degC, name: 베어링 온도 }
  - { signal: suction_temp, prefix: TS, unit: degC, name: 흡입 온도 }
  - { signal: discharge_temp, prefix: TD, unit: degC, name: 토출 온도 }
  - { signal: oil_temp, prefix: LOT, unit: degC, name: 윤활유 공급 온도 }
  - { signal: suction_pressure, prefix: PS, unit: bar(g), name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PD, unit: bar(g), name: 토출 압력 }
  - { signal: oil_pressure, prefix: LOP, unit: bar(g), name: 윤활유 공급 압력 }
  - { signal: steam_pressure, prefix: SP, unit: bar(g), name: 입구 증기 압력 }
  - { signal: flow, prefix: FI, unit: m3/h, name: 유량 }
  - { signal: current, prefix: II, unit: A, name: 모터 전류 }
  - { signal: speed, prefix: SI, unit: rpm, name: 축 회전속도 }
  - { signal: axial_position, prefix: ZI, unit: mm, name: 축방향 상대 위치 }

equipment:
  # ---------------- UNIT-RFCC-01 원료 공급 ----------------
  - equip_id: P-1101A
    name: Feed Charge Pump
    type: PM
    unit_id: UNIT-RFCC-01
    seed_key: e01
    tags:
      - { tag_id: VI-P-1101A, signal: vibration, unit: mm/s RMS, description: "펌프 구동측 케이싱 진동 속도 Overall RMS",
          interval_sec: 1, decimals: 4, seed_key: r001, normal: { base: 1.45, noise_sd: 0.03375 } }
      - { tag_id: TI-P-1101A, signal: bearing_temp, unit: degC, description: "펌프 구동측 베어링 온도",
          interval_sec: 10, decimals: 4, seed_key: r002, normal: { base: 66, noise_sd: 0.035 } }
      - { tag_id: PS-P-1101A, signal: suction_pressure, unit: bar(g), description: "흡입 압력",
          interval_sec: 1, decimals: 4, seed_key: r003, normal: { base: 3.2, noise_sd: 0.008 } }
      - { tag_id: PD-P-1101A, signal: discharge_pressure, unit: bar(g), description: "토출 압력",
          interval_sec: 1, decimals: 4, seed_key: r004, normal: { base: 19, noise_sd: 0.025 } }
      - { tag_id: FI-P-1101A, signal: flow, unit: m3/h, description: "액체 체적 유량",
          interval_sec: 1, decimals: 4, seed_key: r005, normal: { base: 210, noise_sd: 0.315 } }
      - { tag_id: II-P-1101A, signal: current, unit: A, description: "구동 모터 전류",
          interval_sec: 1, decimals: 4, seed_key: r006, normal: { base: 145, noise_sd: 0.174 } }
  # ---------------- UNIT-RFCC-02 촉매 재생 ----------------
  - equip_id: B-1201
    name: Main Air Blower
    type: BL
    unit_id: UNIT-RFCC-02
    driven_by: E-1202
    seed_key: e02
    tags:
      - { tag_id: VX-B-1201, signal: shaft_vibration, unit: um p-p, description: "구동측 X축 상대 진동",
          interval_sec: 1, decimals: 4, seed_key: r007, normal: { base: 32, noise_sd: 0.65 } }
      - { tag_id: VY-B-1201, signal: shaft_vibration, unit: um p-p, description: "구동측 Y축 상대 진동",
          interval_sec: 1, decimals: 4, seed_key: r008, normal: { base: 29, noise_sd: 0.65 } }
      - { tag_id: TI-B-1201, signal: bearing_temp, unit: degC, description: "구동측 저널 베어링 온도",
          interval_sec: 10, decimals: 4, seed_key: r009, normal: { base: 78, noise_sd: 0.035 } }
      - { tag_id: PS-B-1201, signal: suction_pressure, unit: bar(g), description: "입구 공기 압력",
          interval_sec: 1, decimals: 4, seed_key: r010, normal: { base: -0.015, noise_sd: 0.001 } }
      - { tag_id: PD-B-1201, signal: discharge_pressure, unit: bar(g), description: "토출 공기 압력",
          interval_sec: 1, decimals: 4, seed_key: r011, normal: { base: 2.8, noise_sd: 0.012 } }
      - { tag_id: FI-B-1201, signal: flow, unit: Nm3/h, description: "표준 상태 공기 체적 유량",
          interval_sec: 1, decimals: 4, seed_key: r012, normal: { base: 180000, noise_sd: 160 } }
      - { tag_id: SI-B-1201, signal: speed, unit: rpm, description: "축 회전속도",
          interval_sec: 1, decimals: 4, seed_key: r013, normal: { base: 5200, noise_sd: 1.2 } }
      - { tag_id: LOP-B-1201, signal: oil_pressure, unit: bar(g), description: "윤활유 공급 압력",
          interval_sec: 1, decimals: 4, seed_key: r014, normal: { base: 2.2, noise_sd: 0.004 } }
  # ---------------- UNIT-RFCC-03 동력 회수 ----------------
  - equip_id: E-1202
    name: Power Recovery Expander
    type: EX
    unit_id: UNIT-RFCC-03
    seed_key: e03
    tags:
      - { tag_id: VX-E-1202, signal: shaft_vibration, unit: um p-p, description: "구동측 X축 상대 진동",
          interval_sec: 1, decimals: 4, seed_key: r015, normal: { base: 35, noise_sd: 0.7 } }
      - { tag_id: VY-E-1202, signal: shaft_vibration, unit: um p-p, description: "구동측 Y축 상대 진동",
