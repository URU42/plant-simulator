# 구성안 2: RFCC 회전기계 (설계 docs/superpowers/specs/2026-11-09-rfcc-simulator-design.md)
# - 출처: rfcc-20261109 v1.2.0 의 support/config.json. 설비 12대, 태그 81개 + 합성 1개(STT-T-1401, 2026-11-19).
# - 온도(bearing_temp / suction_temp / discharge_temp / oil_temp) 16개는 10초, 나머지 65개는 1초 주기.
# - 한계값 (2026-11-23 사용자 확정, synthetic): 공학 기준값으로 바꿨다. 이전의 통계 한계(경고 μ±3σ, 알람 μ±4.5σ·정지 μ±6σ, D23)는 대체했다.
#   다른 공장(CDU·HOU·RHDS·VRDS) 같은 신호의 규칙을 옮겼다 — 펌프 진동 3.0/4.5/7.1 mm/s, 베어링 온도 펌프 80/90/100·터보기계 85/95/105 ℃,
#   축 위치 ±0.35/±0.53/±0.88 mm 는 절대값, 유량·압력·전류·회전수·윤활유·흡입/토출 온도는 μ 대비 비율 중앙값(태그별 limit_basis).
#   축 진동은 ISO 7919-3 회전수 의존 영역 경계(A/B·B/C·C/D = 4800·9000·13200/√N µm p-p, 사용자 확정 2026-11-23 — API 617 식은 출하 시험
#   기준이라 정상 μ 보다 낮아 쓰지 않았다). 증기 압력·온도는 설계값 ±10/15/20 %.
#   대기압 가까운 압력 2개(송풍기 입구 PS-B-1201, 팽창 터빈 출구 PD-E-1202)는 따로 정했다(AI 결정). 유효숫자 3자리.
#   control(μ·σ, 팀의 baselines.json)은 그대로라 탐지 쪽 Nelson 관리 기준은 바뀌지 않는다. 매뉴얼의 정상 중심값은 그대로 경보값으로 쓰지 않았다.
# - driven_by: 같은 축으로 직접 결합된 설비. 피구동 설비의 speed 태그는 구동기의 속도를 그대로 쓴다.
# - seed_key: 태그 r001~r081. ID 를 바꿔도 생성 값이 유지된다.

# - 같은 설비 안 관계 (2026-11-19, synthetic): derive 가 있는 태그는 매 표본 그 시각 같은 설비 태그로 계산한다 — 펌프 전류 ∝ 유량 × 양정,
#   팬 전류 ∝ 유량³·차압 ∝ 유량², 압축기 토출 온도(K) ∝ 흡입 온도(K) × 압축비^m (m 은 자료 μ 로 맞춤), 베어링 온도(K) ∝ 윤활유 온도(K).
#   식이 정하는 변동을 그대로 쓴다(물리식 우선, 사용자 확정). μ 는 자료 그대로, σ 는 식만의 변동이 자료 σ 를 넘으면 정상 생성값으로 바꿨다
#   (자체 잡음 = 자료 σ × 0.3). 자료 σ 이하면 자료 σ 에 맞게 자체 잡음으로 채웠다. RFCC 의 μ±3σ 경고 한계는 새 σ 로 다시 계산했다.
plant:
  plant_id: PL-RFCC
  name: "RFCC(중질유 유동상 촉매 분해)"
  config_version: 8                 # 2026-11-23 한계값을 공학 기준값으로 (7: 통계 μ±3σ·4.5σ·6σ)
  unit_groups:
    - id: UG-RFCC-01
      name: 원료 공급
      units:
        - { id: UNIT-RFCC-01, name: 원료 공급 }
    - id: UG-RFCC-02
      name: 반응·재생
      units:
        - { id: UNIT-RFCC-02, name: 촉매 재생 }
        - { id: UNIT-RFCC-03, name: 동력 회수 }
    - id: UG-RFCC-03
      name: 주분별
      units:
        - { id: UNIT-RFCC-04, name: 슬러리·LCO 순환·탑정 처리 }
    - id: UG-RFCC-04
      name: 가스 압축·회수
      units:
        - { id: UNIT-RFCC-05, name: 습가스 압축 }
        - { id: UNIT-RFCC-06, name: 습가스 압축 구동 }
        - { id: UNIT-RFCC-07, name: 흡수·분별·안정화 }
    - id: UG-RFCC-05
      name: 제품 처리
      units:
        - { id: UNIT-RFCC-08, name: LPG·가솔린 처리 }

# 설비 유형 매핑. kind 는 기계 종류 (참고)
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: BL, name: 송풍기, prefix: B, kind: blower }
  - { type: EX, name: 팽창 터빈, prefix: E, kind: expander }
  - { type: CC, name: 원심 압축기, prefix: C, kind: compressor }
  - { type: ST, name: 증기 터빈, prefix: T, kind: turbine }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: mm/s RMS, name: 케이싱 진동 속도 }
  - { signal: shaft_vibration, prefix: VX, unit: um p-p, name: 축 상대 진동 }
  - { signal: bearing_temp, prefix: TI, unit: degC, name: 베어링 온도 }
  - { signal: suction_temp, prefix: TS, unit: degC, name: 흡입 온도 }
  - { signal: discharge_temp, prefix: TD, unit: degC, name: 토출 온도 }
  - { signal: oil_temp, prefix: LOT, unit: degC, name: 윤활유 공급 온도 }
  - { signal: suction_pressure, prefix: PS, unit: bar(g), name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PD, unit: bar(g), name: 토출 압력 }
  - { signal: oil_pressure, prefix: LOP, unit: bar(g), name: 윤활유 공급 압력 }
  - { signal: steam_pressure, prefix: SP, unit: bar(g), name: 입구 증기 압력 }
  - { signal: steam_temp, prefix: STT, unit: degC, name: 입구 증기 온도 }
  - { signal: flow, prefix: FI, unit: m3/h, name: 유량 }
  - { signal: current, prefix: II, unit: A, name: 모터 전류 }
  - { signal: speed, prefix: SI, unit: rpm, name: 축 회전속도 }
  - { signal: axial_position, prefix: ZI, unit: mm, name: 축방향 상대 위치 }

# 정상 운전 공통 요인 (synthetic): 공정 그룹마다 평균 0 인 빠른 성분 하나를 아래 신호의 태그들이 나눠 갖는다.
# 태그 분산 중 share 만큼이 공통 요인이고, 부호는 그 신호가 부하와 같이(1)·반대로(-1) 움직이는지다.
# 평균은 μ 그대로라 Nelson 규칙과 충돌하지 않는다. 느린 부하·운전점 변화는 고장 모드(OP-LOAD-CHANGE)로만 넣는다.
correlation:
  share: 0.5
  signs: { flow: 1, current: 1, speed: 1, discharge_pressure: 1, steam_pressure: 1, suction_pressure: -1 }

# 공정 흐름 그래프 (프로젝트 가상 공장, 2026-11-20). 3D 뷰어 그래프(2026-11-19)에서 옮겼고 뷰어는 GET /{공장}/flow 로 읽는다.
# 간선 [from, to, label, stream]. stream 은 뷰어의 계통 구분 규칙을 옮긴 값이다. 축 연결은 driven_by 가 맡아 넣지 않는다.
flow:
  nodes:
    RX: "반응기"
    REG: "촉매 재생기"
    FR: "주분별탑"
    GR: "가스 회수 설비"
  edges:
    - [P-1101A, RX, "", process]
    - [RX, FR, "", process]
    - [FR, C-1401, "", process]
    - [C-1401, GR, "", process]
    - [GR, P-1501A, "", process]
    - [GR, P-1502A, "", process]
    - [RX, REG, "", utility]
    - [REG, RX, "", utility]
    - [B-1201, REG, "", utility]
    - [FR, P-1301A, "", process]
    - [P-1301A, FR, "", process]
    - [FR, P-1302A, "", process]
    - [P-1302A, FR, "", process]
    - [FR, P-1303A, "", process]
    - [P-1303A, FR, "", process]
    - [GR, P-1402A, "", process]
    - [P-1402A, GR, "", process]
    - [GR, P-1403A, "", process]
    - [P-1403A, GR, "", process]

equipment:
  # ---------------- UNIT-RFCC-01 원료 공급 ----------------
  - equip_id: P-1101A
    name: Feed Charge Pump
    type: PM
    unit_id: UNIT-RFCC-01
    tags:
      - { tag_id: VI-P-1101A, signal: vibration, unit: mm/s RMS, description: "펌프 구동측 케이싱 진동 속도 Overall RMS",
          limits: { warn_hi: 3, alarm_hi: 4.5, trip_hi: 7.1 }, limit_basis: "펌프 진동 3.0/4.5/7.1 mm/s(API 610 선호운전영역·ISO 20816-3 경계, 다른 공장 펌프에서 가장 흔한 값) (synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
          interval_sec: 1, decimals: 4, seed_key: r001, control: { mean: 1.4575, sigma: 0.03761084502112299 } }
      - { tag_id: TI-P-1101A, signal: bearing_temp, unit: degC, description: "펌프 구동측 베어링 온도",
          limits: { warn_hi: 80, alarm_hi: 90, trip_hi: 100 }, limit_basis: "펌프 베어링 80/90/100 ℃(다른 공장 펌프에서 가장 흔한 값) (synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
          interval_sec: 10, decimals: 4, seed_key: r002, control: { mean: 65.0117, sigma: 0.17651137414737636 } }
      - { tag_id: PS-P-1101A, signal: suction_pressure, unit: bar(g), description: "흡입 압력",
          limits: { trip_lo: 1.33, alarm_lo: 1.67, warn_lo: 2.09 }, limit_basis: "CDU·HOU·RHDS·VRDS 같은 신호 비율 중앙값: warn_lo 0.652μ·alarm_lo 0.522μ·trip_lo 0.417μ (synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
          interval_sec: 1, decimals: 4, seed_key: r003, control: { mean: 3.2, sigma: 0.0076193214288587 } }
      - { tag_id: PD-P-1101A, signal: discharge_pressure, unit: bar(g), description: "토출 압력",
          limits: { alarm_lo: 11.1, warn_lo: 13.8, warn_hi: 24, alarm_hi: 25.2, trip_hi: 26.4 }, limit_basis: "CDU·HOU·RHDS·VRDS 같은 신호 비율 중앙값: warn_hi 1.264μ·alarm_hi 1.328μ·trip_hi 1.39μ·warn_lo 0.724μ·alarm_lo 0.583μ (synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
          interval_sec: 1, decimals: 4, seed_key: r004, control: { mean: 19.01285, sigma: 0.030415587636555778 } }
      - { tag_id: FI-P-1101A, signal: flow, unit: m3/h, description: "액체 체적 유량",
          limits: { trip_lo: 110, alarm_lo: 138, warn_lo: 160 }, limit_basis: "CDU·HOU·RHDS·VRDS 같은 신호 비율 중앙값: warn_lo 0.766μ·alarm_lo 0.659μ·trip_lo 0.526μ (synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
          interval_sec: 1, decimals: 4, seed_key: r005, control: { mean: 209.4573, sigma: 0.6623794814991241 } }
      - { tag_id: II-P-1101A, signal: current, unit: A, description: "구동 모터 전류",
          limits: { warn_hi: 185, alarm_hi: 197, trip_hi: 212 }, limit_basis: "CDU·HOU·RHDS·VRDS 같은 신호 비율 중앙값: warn_hi 1.28μ·alarm_hi 1.359μ·trip_hi 1.464μ (synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
          interval_sec: 1, decimals: 4, seed_key: r006,
          derive: { formula: power, terms: [{ tag: FI-P-1101A, exp: 1 }, { tag: PD-P-1101A, minus: PS-P-1101A, exp: 1 }], noise_sigma: 0.102991 }, control: { mean: 144.7389, sigma: 0.67389 } }
  # ---------------- UNIT-RFCC-02 촉매 재생 ----------------
  - equip_id: B-1201
    name: Main Air Blower
    type: BL
    unit_id: UNIT-RFCC-02
    driven_by: E-1202
    tags:
      - { tag_id: VX-B-1201, signal: shaft_vibration, unit: um p-p, description: "구동측 X축 상대 진동",
          limits: { warn_hi: 66.6, alarm_hi: 125, trip_hi: 183 }, limit_basis: "ISO 7919-3 영역 경계 A/B·B/C·C/D = 4800·9000·13200/√N µm p-p, N 5199 rpm (synthetic, 2026-11-23 · 이전 μ±3σ/4.5σ/6σ(D23) 대체)",
          interval_sec: 1, decimals: 4, seed_key: r007, control: { mean: 32.03885, sigma: 0.751828352128607 } }
      - { tag_id: VY-B-1201, signal: shaft_vibration, unit: um p-p, description: "구동측 Y축 상대 진동",
