      - { tag_id: TI-P-1101A, ratio: 0.6486 }      # 1.2 / 1.85
    description: 흡입 압력 감소·유량 감소·Overall 진동 상승 후 완만한 회복. 캐비테이션 확정에는 유체 온도·증기압·NPSH·파형이 필요하다

  # DEV-RFCC-002 베어링·윤활 상태 점검 필요 (P-1301A, 90분): 진동·베어링 온도 완만 상승, 전류 소폭 상승
  - event_id: EV-RFCC-002
    tag_id: VI-P-1301A
