# RFCC 개발용 시나리오 (설계 §4.3). rfcc-20261109/evaluation_reference/development_events.json 과
# support/generate.py 의 주입 식을 옮겼다. 샘플과 같은 KST 시각에 시작해 매주 같은 요일·시각에 반복한다.
# - swell: 완만히 올라가 머물다 내려오는 발생·회복 포락선. magnitude 는 기준 태그(진동)의 편차 크기
# - related.ratio: 기준 태그 편차에 대한 배율 (샘플 식의 계수 ÷ magnitude)
# - 확정 고장이 아니므로 failure_id 를 주지 않는다 (failure_history 에 들어가지 않는다)

events:
  # DEV-RFCC-001 흡입 조건 악화 의심 (P-1101A, 40분): 흡입 압력·유량·토출 압력·전류 감소, 진동·베어링 온도 상승
  - event_id: EV-RFCC-001
    tag_id: VI-P-1101A
    pattern: swell
    start: 2026-11-02T05:10:00+09:00
    duration: 40m
    repeat_every: 7d
    magnitude: 1.85
    related:
      - { tag_id: PS-P-1101A, ratio: -0.4595 }     # −0.85 / 1.85
      - { tag_id: PD-P-1101A, ratio: -0.4865 }     # −0.9 / 1.85
