exclusions:
  B-1201: "주 공기 블로어(E-1202 축 구동): 압축성 공기·팽창기 축 결합 열역학 모델이 없습니다."
  E-1202: "동력 회수 팽창기: 배가스 팽창 열역학 모델이 없습니다. 축계 구동 요소(전동기·기어박스·터빈)로 수력 회로 요소가 아닙니다. 축 전파는 기존 경험 신호입니다."
  P-1301A: "슬러리 펌프어라운드: FR 순환 루프이고 유량(379 m3/h)이 원료보다 커 단일 헤더 수지로 표현할 수 없습니다."
  P-1302A: "LCO 펌프어라운드: FR 순환 루프이고 유량(240 m3/h)이 원료보다 커 단일 헤더 수지로 표현할 수 없습니다."
  C-1401: "습가스 기상 압축기: 압축성·다단 열역학·서지 모델이 없어 단상 비압축 회로로 표현할 수 없습니다. 기존 경험 신호 모드만 있습니다."
  T-1401: "증기 터빈 구동기: 축계 구동 요소(전동기·기어박스·터빈)로 수력 회로 요소가 아닙니다. 축 전파는 기존 경험 신호입니다."
  P-1402A: "흡수유 펌프: GR→P-1402A→GR 루프와 가스 회수부 수력을 계산하지 않습니다."
  P-1403A: "가스 회수 환류 펌프: GR→P-1403A→GR 루프와 가스 회수부 수력을 계산하지 않습니다."
  P-1501A: "LPG 이송 펌프: 원료 회로와 습가스 압축기(기상)로만 이어져 연결 회로로 풀 수 없고, 독립 회로 경계·검증을 수행하지 않았습니다."
  P-1502A: "가솔린 이송 펌프: 원료 회로와 습가스 압축기(기상)로만 이어져 연결 회로로 풀 수 없고, 독립 회로 경계·검증을 수행하지 않았습니다."
