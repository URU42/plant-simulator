# synthetic assumption: PL-RFCC 대표 수력 등가회로 (P-1101A·P-1101B 병렬 → 공통 헤더 → 두 등가 분기, 제품 분기에 P-1303A).
# scripts/calibrate_physics.py rfcc 로 생성. 정상 해는 plant_rfcc.yaml 의 운전점 μ 를 재현한다.
# 밀도·회전수·효율·체절 비·배관 치수·분기 압력 비율·NPSHr·정상 NPSH 여유비·유체 온도는 합성 설계 선택이며 현장 자료가 아니다.
# 입력 펌프 두 대의 직렬·병렬 관계와 토출 라인(10 m, 2 m/s, 체크밸브 K 2.0, 게이트 K 0.2)도 합성 가정이다(PU-D4·D5a).
# 고장 최대치는 아래 목표(태그 단위)에 닿도록 역산했다. None 은 해당 하한이 마스터에 없어 기본 10 % 를 쓴 항목.
# 제품 분기 끝에 후속 펌프 흡입 드럼(탑·드럼 대용모델, 2026-11-26, open-issues 42·43): inlet_abs_pa = 정상 후속 흡입압.
#   액위 조절 밸브(정상점 토출 저항의 50 %, 정상 개도 0.5)가 유출 = 유입을 맞추고, 고장 최대치는 드럼 회로로 역산했다.
#   product_flow_m3h: 81.74
#   valve_share_basis: flow
#   source_suction: 1.534
#   source_discharge: 9.75
#   downstream_suction: 1.196
#   downstream_discharge: None
