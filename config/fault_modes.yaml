          - { signal: vibration, shape: ramp, z: 10, rise_sec: 1200 }
          - { signal: bearing_temp, shape: ramp, z: 12, lag_sec: 120, rise_sec: 1200 }
        propagate:
          driven:
            - { signal: shaft_vibration, shape: ramp, z: 3, lag_sec: 10, rise_sec: 900 }   # 출력축 → 압축기
    expect:
      stages:
