# 고장 모드(가상 시나리오) 정의 — 모든 수치·지연·궤적은 synthetic 합성 가정이며 공정·설비 담당 검토 전이다.
#
# 정상 운전에는 이상이 없고, POST /{공장}/anomalies {equip_id, mode} 로 주입한 때부터 아래 효과가 정상 신호 위에 더해진다.
# - 효과는 tag_id 가 아니라 signal 로 지정한다. 같은 태그에 겹친 효과는 z 를 더한다.
# - 크기: z(관리 기준 σ 배수, 앞 효과에 더한다) 또는 to_limit(그 태그의 효과 합을 한계값까지, margin 만큼 더:
#   목표 z = (한계 − μ)/σ × (1 + margin). 앞 단계 step·ramp 가 남긴 수준을 빼고 그만큼만 움직인다).
#   to_limit 이 그 태그에 없으면(예: RFCC 는 경고 한계만 있다) z 를 쓰고, z 도 없으면 그 태그에는 걸지 않는다.
# - shape: step(바로) / ramp(rise_sec 동안 0→z 뒤 유지) / spike(rise_sec 동안 0→z, decay_sec 동안 z→0) / wobble(진폭 z, 주기 period_sec)
# - lag_sec 는 단계 시작(at_sec) 뒤 지연. 멈추면 손상(damage) 효과를 뺀 모든 효과가 60초 동안 0 으로 가라앉는다.
# - propagate.driven: 축으로 이어진 아래쪽 설비(driven_by 사슬)에 주는 효과. speed 는 생성기가 구동기 값을 그대로 넘긴다.
# - nelson_quiet: 그 단계 동안 효과를 더한 값도 Nelson 규칙 1~3 을 어기지 않게 고른다 (ML 만 잡는 전조를 만드는 합성 장치).
# - damage: 손상 단계. 그 단계의 step·ramp 효과는 멈춘 뒤에도 멈춘 시각의 크기로 남고, POST /{공장}/anomalies/{설비}/repair
#   (수리) 뒤 회복 시간 동안 0 이 된다. spike·wobble 은 순간 현상이라 남지 않는다. 어느 단계를 손상으로 볼지는
#   단계 이름(손상·마모·오염·침식·누설·파손)을 따라 고른 대상 단계는 사용자 확정(2026-11-23)이다. 효과 크기는 synthetic 그대로다.
#   수리는 API·화면으로만 한다. 백엔드 조치 완료와는 연결하지 않는다(사용자 결정 2026-11-23, 바뀔 수 있다).
# - label 은 정답 분류, expect 는 평가용 기대값(자유 형식). 둘 다 정답지(GET /anomalies)에만 나간다.
#   label.code 는 정답지 코드: 0 비정상(설비 고장, 기본), 1 정상(정상 운전 변화). 계측 이상은 2 (실행 설정 instrument_faults).
#   expect.alarms 의 self 는 주입 설비, driven 은 아래쪽 설비.
# - unobserved: 실제 고장이면 보일 신호지만 마스터에 태그가 없어 만들지 않는 것. 기록용이며 /fault-modes·정답지에 나간다.
#   시나리오는 지금 있는 설비·태그만으로 표현한다. 태그를 더할지는 따로 정한다.

fault_modes:
  - id: ST-WATER-INDUCTION
    name: 증기터빈 수분 유입
    equip_types: [ST]
    unobserved: [드레인 밸브 상태, 케이싱 상·하부 온도차]   # 증기 온도는 합성 태그(STT-T-1401)로 더했다
    label:
      kind: 기계 이상
      cause: 증기 수분 유입에 따른 열충격·액체 충돌, 로터·블레이드 손상 후보
      action: 증기 건도·드레인 계통 점검, 진동 추이 확인 후 정지 검토
    stages:
      - id: S0
        name: 전조 — 규칙 1~3 에 걸리지 않는 분포 변화
        at_sec: 0
        nelson_quiet: true
        effects:
          - { signal: steam_pressure, shape: wobble, z: 1.2, period_sec: 8 }
          - { signal: steam_temp, shape: ramp, z: -1.0, rise_sec: 300 }          # 과열도가 조금씩 준다 (수분 유입의 직접 증거)
          - { signal: shaft_vibration, shape: ramp, z: 0.8, rise_sec: 300 }
      - id: S2
        name: 열충격·액체 충돌
        at_sec: 900
        effects:
          - { signal: shaft_vibration, shape: spike, to_limit: alarm_hi, margin: 0.1, rise_sec: 5, decay_sec: 60 }   # 2026-11-23 RFCC 공학 한계값에 맞춰 z → to_limit (z 는 그 한계가 없는 태그의 대안)
          - { signal: speed, shape: spike, z: -4, rise_sec: 3, decay_sec: 30 }     # 피구동 압축기 회전속도도 같이
          - { signal: steam_temp, shape: ramp, to_limit: warn_lo, margin: 0.1, z: -220, rise_sec: 120 }   # 약 −44 ℃, 젖은 증기로 포화 온도 쪽으로
      - id: S3
        name: 로터·블레이드 손상
        at_sec: 1020
        damage: true
        effects:
          - { signal: shaft_vibration, shape: step, to_limit: warn_hi, margin: 0.2 }
          - { signal: shaft_vibration, shape: ramp, to_limit: trip_hi, margin: 0.05, z: 12, rise_sec: 1800 }   # 2026-11-23 RFCC 공학 한계값에 맞춰 z → to_limit (z 는 그 한계가 없는 태그의 대안)
          - { signal: bearing_temp, shape: ramp, to_limit: warn_hi, margin: 0.1, z: 15, lag_sec: 60, rise_sec: 1200 }
          - { signal: oil_temp, shape: ramp, z: 5, lag_sec: 300, rise_sec: 1200 }
        propagate:
          driven:
            - { signal: shaft_vibration, shape: ramp, z: 4, lag_sec: 10, rise_sec: 600 }    # 커플링 전달
            - { signal: flow, shape: ramp, z: -6, lag_sec: 30, rise_sec: 600 }
    expect:
      stages:
        S0: { setpoint: none, nelson: [], ml_plant: high, top_signals: [steam_temp, steam_pressure, shaft_vibration] }
        S2: { setpoint: alarm, nelson: [1], nelson_maybe: [3], ml_plant: high }   # 2026-11-23 RFCC 공학 한계값 (전: μ±6σ 로 정지)
        S3: { setpoint: trip, nelson: [1, 2], ml_plant: high }
      alarms:
        - { equip: self, count: 1, opens_in: S0, opened_by: ml, upgrades_in: S2 }
        - { equip: driven, count: 1, opens_in: S2, related_to: self }       # S2 회전속도 공유, S3 진동·유량

  - id: CC-SURGE
    name: 원심 압축기·송풍기 서지
    equip_ids: [C-1401, C-2301, C-3101, C-4101, B-1201]   # 원심 압축기와 RFCC 주 공기 송풍기 (설비 유형 CC 는 왕복동과 구분하지 않는다)
    unobserved: [안티서지 밸브 개도, 서지 한계선 대비 운전점(유량-양정)]
    label:
      kind: 공정·기계 이상
      cause: 저유량 운전으로 서지 한계 도달, 압력·유량 진동, 스러스트 베어링 충격
      action: 안티서지 밸브·제어기 점검, 운전점 복귀
    stages:
      - id: S1
        name: 저유량 운전 → 서지 한계 접근
        at_sec: 0
        effects:
          - { signal: flow, shape: ramp, z: -10, rise_sec: 120 }
      - id: S2
        name: 서지 발생 → 압력·유량 진동
        at_sec: 120
        effects:
          - { signal: flow, shape: wobble, z: 15, period_sec: 4 }
          - { signal: discharge_pressure, shape: wobble, z: 8, period_sec: 4 }
          - { signal: discharge_temp, shape: ramp, z: 10, lag_sec: 30, rise_sec: 300 }
        # 공정 흐름 하류 (2026-11-20, synthetic). 1단계 크기·지연이며 2단계는 크기 ×0.7, lag·rise ×2, 회복 시간도 단계만큼 늘어난다
        propagate:
          process:
            - { signal: flow, shape: wobble, z: 0.5, period_sec: 4, lag_sec: 10 }     # 서지 맥동이 하류 처리량에 약하게 전달
      - id: S3
        name: 스러스트 베어링·실 충격
        at_sec: 150
        effects:
          - { signal: axial_position, shape: spike, z: 6, rise_sec: 2, decay_sec: 20 }
          - { signal: shaft_vibration, shape: step, z: 10 }
          - { signal: vibration, shape: step, z: 10 }
    expect:
      stages:
        S1: { nelson: [1, 2], ml_plant: high }
        S2: { nelson: [1], ml_plant: high }
        S3: { nelson: [1], ml_plant: high }
      alarms:
        - { equip: self, count: 1, opens_in: S1 }

  - id: PM-SUCTION-LOSS
    name: 펌프 흡입 조건 악화 (캐비테이션 후보)
    equip_types: [PM]
    unobserved: [흡입 탱크 액위, 스트레이너 전후 차압, 유체 증기압(NPSH 여유), 흡입 유체 온도(태그 없는 펌프)]
    # 교호작용 (℃ 기준·계수 0.03·경고 구간 보장 모두 사용자 확정 2026-11-23, 수치는 synthetic): 흡입 유체 온도(process_temp)가
    # 사건으로 오른 만큼 진동·유량 효과를 키운다. 증기압이 올라 NPSH 여유가 줄면 같은 흡입 압력 저하에도 캐비테이션이 심해진다는 것을
    # 단순화했다 (NPSH 공식 아님). 배율 = min(2.0, 1 + 0.03 × ΔT ℃): +10 ℃ ×1.3, +15 ℃ ×1.45, 약 +33 ℃ 이상 ×2.0.
    # hold_below_alarm(경고 구간 보장): 경보 한계 목표 단계(S3) 전에는 키운 효과가 경보 한계 3σ 안쪽에 머물고, S3 효과의 상승 시간 동안
    # 서서히 풀린다. 태그 설명이 "흡입 유체 온도"인 펌프 3대만 (P-3102·P-4102·P-8303A, 사용자 확정 2026-11-23 — 처음엔 취급·인출 유체
    # 온도인 P-2701·P-8301A 도 넣은 5대였다. Auto Ontology·다른 PM 규칙과 같은 기준). 배율 방식은 공통 기준으로 확정(같은 날)
    boost: &pm_boost { by: process_temp, signals: [vibration, flow], per_unit: 0.03, max_gain: 2.0, hold_below_alarm: true,
                       equip_ids: [P-3102, P-4102, P-8303A] }
    label:
      kind: 공정·기계 이상
      cause: 흡입 측 제약(스트레이너 막힘·탱크 액위 저하 후보)으로 흡입 압력 저하, 캐비테이션 가능성
      action: 흡입 계통(스트레이너·탱크 액위·밸브) 점검, 지속 시 예비기 전환 검토
    stages:
      - id: S1
        name: 흡입 압력 저하
        at_sec: 0
        hydraulic: [{parameter: strainer_blockage, amount: 0.45, rise_sec: 600}]
        effects:
          - { signal: suction_pressure, shape: ramp, to_limit: warn_lo, margin: 0.1, z: -6, rise_sec: 600 }
      - &pm_s2
        id: S2
        name: 펌프 관측 이상 — 진동 증가·유량 저하
        at_sec: 300
        effects:
          - { signal: vibration, shape: ramp, to_limit: warn_hi, margin: 0.1, z: 6, rise_sec: 300 }
          - { signal: flow, shape: ramp, to_limit: warn_lo, margin: 0.05, z: -6, rise_sec: 300 }
          - { signal: discharge_pressure, shape: ramp, z: -8, rise_sec: 300 }
          - { signal: oil_pressure, shape: ramp, z: -6, rise_sec: 300 }       # 윤활유 펌프(P-2501)의 송출 = 윤활유 압력 (경고 한계 없음)
        # 공정 흐름 하류 (2026-11-20, synthetic). 1단계 크기·지연이며 2단계는 크기 ×0.7, lag·rise ×2, 회복 시간도 단계만큼 늘어난다
        propagate:
          process:                                  # 송출량 감소 → 하류 처리량 감소 (전류는 계산 태그라 유량을 따라 움직인다)
            - { signal: flow, shape: ramp, z: -1.0, lag_sec: 60, rise_sec: 300 }
          # 윤활유 펌프(HOU P-2501) → 압축기 C-2301 베어링 온도. 윤활유 상실은 압축기 보호 항목이라 한계까지 올린다(사용자 확정 2026-11-23,
          # 수치 synthetic). 펌프 단계를 따라 경고 → 경보 → 정지 한계. 압축기 정지(trip) 연동은 모의하지 않는다
          utility:
            - { signal: bearing_temp, shape: ramp, to_limit: warn_hi, margin: 0.1, z: 2.0, lag_sec: 60, rise_sec: 600 }
      - &pm_s3
        id: S3
        name: 이상 심화
        at_sec: 900
        hydraulic: [{parameter: strainer_blockage, amount: 0.55, rise_sec: 600}]
        effects:
          - { signal: suction_pressure, shape: ramp, to_limit: alarm_lo, margin: 0.05, z: -6, rise_sec: 600 }
          - { signal: vibration, shape: ramp, to_limit: alarm_hi, margin: 0.05, z: 6, rise_sec: 600 }
          - { signal: flow, shape: ramp, to_limit: alarm_lo, margin: 0.05, z: -6, rise_sec: 600 }
          - { signal: bearing_temp, shape: ramp, z: 10, lag_sec: 120, rise_sec: 900 }
          - { signal: oil_pressure, shape: ramp, to_limit: alarm_lo, margin: 0.05, z: -6, rise_sec: 600 }
        propagate:
          utility:
            - { signal: bearing_temp, shape: ramp, to_limit: alarm_hi, margin: 0.05, z: 4.0, lag_sec: 60, rise_sec: 600 }
      - &pm_s4
        id: S4
        name: 정지 한계 도달 — 심한 캐비테이션
        at_sec: 1800
        effects:                                    # 정지 한계가 있는 태그만 (없으면 건너뛴다)
          - { signal: vibration, shape: ramp, to_limit: trip_hi, margin: 0.05, rise_sec: 300 }
          - { signal: flow, shape: ramp, to_limit: trip_lo, margin: 0.05, rise_sec: 300 }
          - { signal: oil_pressure, shape: ramp, to_limit: trip_lo, margin: 0.05, rise_sec: 300 }
        propagate:
          utility:
            - { signal: bearing_temp, shape: ramp, to_limit: trip_hi, margin: 0.05, z: 4.0, lag_sec: 60, rise_sec: 300 }
    expect:
      stages:
        S1: { setpoint: warn_lo, nelson: [1, 2], ml_plant: high }
        S2: { setpoint: warn, nelson: [1, 2], ml_plant: high }
        S3: { setpoint: alarm, nelson: [1, 2], ml_plant: high }
        S4: { setpoint: trip, nelson: [1, 2], ml_plant: high }
      alarms:
        - { equip: self, count: 1, opens_in: S1, upgrades_in: S3, trips_in: S4 }
        - { equip: utility, only: [P-2501], count: 1, opens_in: S2, upgrades_in: S3, trips_in: S4, related_to: self }   # 윤활유 → C-2301 베어링 온도

  # 흡입 악화에 유체 온도 상승이 겹친 경우 (2026-11-23). PM-SUCTION-LOSS 와 같은 단계에 S1 에서 유체 온도를 +15 ℃ 올린다(synthetic,
  # 세 펌프 모두 경고 한계 아래). 교호작용으로 진동·유량 효과가 ×1.45 까지 커진다. 같은 펌프의 PM-SUCTION-LOSS 와 비교하는 용도.
  - id: PM-SUCTION-HOT
    name: 펌프 흡입 악화 + 흡입 유체 온도 상승 (캐비테이션 후보)
    equip_ids: [P-3102, P-4102, P-8303A]            # 흡입 압력과 흡입 유체 온도(태그 설명 그대로) 태그가 모두 있는 펌프
    unobserved: [흡입 탱크 액위, 스트레이너 전후 차압, 유체 증기압(NPSH 여유), 상류 냉각기 상태]
    boost: *pm_boost
    label:
      kind: 공정·기계 이상
      cause: 흡입 유체 온도 상승(증기압 상승)과 흡입 측 제약이 겹쳐 NPSH 여유 감소, 캐비테이션 가능성
      action: 상류 냉각·온도 제어와 흡입 계통(스트레이너·탱크 액위·밸브) 점검, 지속 시 예비기 전환 검토
    stages:
      - id: S1
        name: 흡입 압력 저하 + 유체 온도 상승
        at_sec: 0
        effects:
          - { signal: suction_pressure, shape: ramp, to_limit: warn_lo, margin: 0.1, z: -6, rise_sec: 600 }
          - { signal: process_temp, shape: ramp, delta: 15, rise_sec: 600 }
      - *pm_s2
      - *pm_s3
      - *pm_s4
    # 생성 확인(2026-11-23, 계수 0.03 + 경고 구간 보장, 펌프 3대): 경고 S2(486~497초) → 경보 S3(940~1068초, 흡입 악화는 1351~1420초)
    # → 정지 S3(1373·1491초, 흡입 악화는 S4). 예외: CDU P-8303A 는 정지가 S4(1871초)
    expect:
      stages:
        S1: { setpoint: warn_lo, nelson: [1, 2], ml_plant: high }
        S2: { setpoint: warn, nelson: [1, 2], ml_plant: high }
        S3: { setpoint: trip, nelson: [1, 2], ml_plant: high }
        S4: { setpoint: trip, nelson: [1, 2], ml_plant: high }
      alarms:
        - { equip: self, count: 1, opens_in: S1, upgrades_in: S3, trips_in: S3 }

  - id: OP-LOAD-CHANGE
    name: 운전 부하 감소 (정상 운전 변화)
    # 회전속도를 바꾸는 구동기. HOU 압축기 2대는 구동기 없이 자기 회전수가 있어 2026-11-23 더했다(사용자 확정, 팬은 제외)
    equip_ids: [T-1401, M-3101, M-3102, M-4102, C-2201, C-2301]
    unobserved: [운전 지시·속도 설정값(SP)]
    label:
      kind: 정상 운전 변화
      code: 1                                       # 정답지 코드 1 = 정상
      cause: 의도한 운전 부하 감소 (회전속도·유량 하향)
      action: 기계 수리 아님. 운전 지시·부하 조건 확인
    stages:
      - id: S1
        name: 회전속도·부하 하향
        at_sec: 0
        effects:
          # 정상 운전 변화라 경고 한계에 닿지 않고 Nelson 규칙 2(평균 이동)·ML 만 알아챌 크기 (2026-11-19 축소, 전 −15·−12σ)
          - { signal: speed, shape: ramp, z: -1.5, rise_sec: 300 }
          - { signal: current, shape: ramp, z: -1.5, lag_sec: 5, rise_sec: 300 }
          # 자기 유량·토출 압력이 있는 설비(HOU 압축기)만 움직인다. 터빈·전동기에는 이 태그가 없어 건너뛴다 (2026-11-23)
          - { signal: flow, shape: ramp, z: -1.5, lag_sec: 10, rise_sec: 300 }
          - { signal: discharge_pressure, shape: ramp, z: -1.0, lag_sec: 10, rise_sec: 300 }
        propagate:
          driven:
            - { signal: flow, shape: ramp, z: -1.5, lag_sec: 10, rise_sec: 300 }
            - { signal: discharge_pressure, shape: ramp, z: -1.0, lag_sec: 10, rise_sec: 300 }
            - { signal: current, shape: ramp, z: -1.5, lag_sec: 5, rise_sec: 300 }
          # 공정 흐름 하류 (2026-11-20, synthetic). 1단계 크기·지연이며 2단계는 크기 ×0.7, lag·rise ×2, 회복 시간도 단계만큼 늘어난다
          process:                                  # 정상 운전 변화라 하류 변화도 정상(코드 1)
            - { signal: flow, shape: ramp, z: -0.75, lag_sec: 60, rise_sec: 300 }
    expect:
      stages:
        S1: { setpoint: none, nelson: [2], ml_plant: high }    # RFCC 도 2026-11-23 공학 한계값 뒤로는 경고에 닿지 않는다(전: 통계 ±3σ 라 표본 약 1 %)
      alarms:
        - { equip: self, kind: 정상 운전 변화 }

  # 처리량 감소 (2026-11-23 사용자 확정, 수치는 synthetic). 회전수 태그가 없는 펌프로 표현하는 정상 운전 변화.
  # 원료 공급 펌프의 송출량을 줄이면(유량 조절 밸브) 흐름 그래프를 따라 하류 펌프 처리량이 함께 준다. 처음엔 CDU 만, 같은 날 다섯 공장으로 넓혔다.
  # 크기는 OP-LOAD-CHANGE 와 같다. 펌프 전류는 계산 태그라 유량·양정을 따라 내려간다.
  - id: OP-THROUGHPUT-CHANGE
    name: 처리량 감소 (정상 운전 변화)
    # 공정 처리량을 정하는 원료 공급 펌프: CDU 원유 공급, RFCC Feed Charge, HOU·RHDS·VRDS 고압 원료 공급
    equip_ids: [P-8101A, P-1101A, P-2101, P-3101, P-4101]
    unobserved: [유량 조절 밸브 개도·처리량 설정값(SP)]
    label:
      kind: 정상 운전 변화
      code: 1                                       # 정답지 코드 1 = 정상
      cause: 의도한 처리량 감소 (공급 유량 하향)
      action: 기계 수리 아님. 운전 지시·처리량 조건 확인
    stages:
      - id: S1
        name: 공급 유량 하향
        at_sec: 0
        hydraulic: [{parameter: valve_restriction, amount: 0.2, rise_sec: 300}]
        effects:
          - { signal: flow, shape: ramp, z: -1.5, rise_sec: 300 }
          - { signal: discharge_pressure, shape: ramp, z: -1.0, rise_sec: 300 }
        propagate:
          process:                                  # 정상 운전 변화라 하류 변화도 정상(코드 1)
            - { signal: flow, shape: ramp, z: -0.75, lag_sec: 60, rise_sec: 300 }
    expect:
      stages:
        S1: { setpoint: none, nelson: [2], ml_plant: high }
      alarms:
        - { equip: self, kind: 정상 운전 변화 }

  # CDU 결합 회로 전용 합성 시나리오. 진동·온도는 경험적 반응이다.
  - id: PM-IMPELLER-WEAR
    name: 임펠러 마모
    equip_ids: [P-8101A]
    physics_only: true
    label: {kind: 공정·기계 이상, cause: 합성 임펠러 마모로 양정과 효율 감소, action: 정지 후 임펠러 점검·수리}
    stages:
      - id: S1
        name: 임펠러 마모 진행
        at_sec: 0
        damage: true
        hydraulic: [{parameter: impeller_wear, amount: 1, rise_sec: 300}]
        effects:
          - {signal: vibration, shape: ramp, z: 5, rise_sec: 300}
          - {signal: bearing_temp, shape: ramp, z: 3, lag_sec: 30, rise_sec: 300}

  - id: PM-DISCHARGE-VALVE-RESTRICTION
    name: 토출 제어밸브 개도 이상
    equip_ids: [P-8101A]
    physics_only: true
    label: {kind: 공정·기계 이상, cause: 합성 제어밸브 개도 저하, action: 밸브 작동과 지시 개도 확인}
    stages:
      - id: S1
        name: 밸브 개도 저하
        at_sec: 0
        hydraulic: [{parameter: valve_restriction, amount: 1, rise_sec: 300}]

  - id: FN-IMPELLER-FOULING
    name: 팬 임펠러 오염·불균형
    equip_types: [FN]
    unobserved: [진동 스펙트럼(1× 회전 성분), 흡입 필터·댐퍼 상태]
    # 교호작용 (2026-11-23 사용자 확정: 지수 2, 운전점 설정 방식, 수치는 synthetic): 같은 오염이라도 회전수에 따라 불균형 진동이 다르다
    # (불균형 힘 ∝ 회전수²). 배율 = min(2.0, (N / N_설계)²), N = 운전점(구성안 operating.speed_rpm) + 사건 효과. 진동 효과 크기는 설계
    # 회전수 기준으로 정하고 배율을 곱한다. 예: ×0.8 회전수 → ×0.64, ×1.05 → ×1.10. 베어링 온도도 같은 배율(불균형 하중·마찰열,
    # 사용자 확정 2026-11-23 — 처음엔 진동만이었다). 늦게 오르는 모양(S2 + 120초)은 그대로. 풍량은 키우지 않는다
    boost: { by: speed, signals: [vibration, bearing_temp], exponent: 2, max_gain: 2.0 }
    # 아래 expect 는 설계 회전수 기준이다. 생성 확인(2026-11-23, 팬 4대): ×0.8 이면 경보에 닿지 않고 S2 후반에야 경고, ×1.05 면 경고·경보가 3~4분 이르다
    label:
      kind: 기계 이상
      cause: 임펠러 오염 퇴적으로 질량 불균형, 진동 증가와 풍량 저하
      action: 임펠러 청소·밸런싱, 베어링 상태 점검
    stages:
      - id: S1
        name: 오염 퇴적 진행
        at_sec: 0
        damage: true
        effects:
          - { signal: vibration, shape: ramp, to_limit: warn_hi, margin: 0.1, z: 8, rise_sec: 1200 }
          - { signal: flow, shape: ramp, z: -4, rise_sec: 1200 }
        # 공정 흐름 하류 (2026-11-20, synthetic). 1단계 크기·지연이며 2단계는 크기 ×0.7, lag·rise ×2, 회복 시간도 단계만큼 늘어난다
        propagate:
          process:                                  # 연소공기 부족 → 가열로 출구 온도 저하 (process_temp 태그가 있는 하류 펌프만)
            - { signal: process_temp, shape: ramp, z: -1.0, lag_sec: 120, rise_sec: 600 }
      - id: S2
        name: 불균형 심화
        at_sec: 1200
        damage: true
        effects:
          - { signal: vibration, shape: ramp, to_limit: alarm_hi, margin: 0.05, z: 15, rise_sec: 900 }
          - { signal: bearing_temp, shape: ramp, z: 10, lag_sec: 120, rise_sec: 900 }
    expect:
      stages:
        S1: { setpoint: warn, nelson: [1, 2], ml_plant: high }
        S2: { setpoint: alarm, nelson: [1, 2], ml_plant: high }
      alarms:
        - { equip: self, count: 1, opens_in: S1, upgrades_in: S2 }

  - id: EX-CATALYST-EROSION
    name: 팽창 터빈 촉매 미립자 부착·침식
    equip_types: [EX]
    unobserved: [배기가스 입구 온도, 배기가스 고형분(촉매 미립자) 농도, 블레이드 상태]
    label:
      kind: 기계 이상
      cause: 배기가스의 촉매 미립자 부착·침식으로 로터 불균형과 효율 저하, 블레이드 손상 후보
      action: 3단 분리기(사이클론) 성능 점검, 진동 추이 확인 후 세정·정비 검토
    stages:
