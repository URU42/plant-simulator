# scripts/calibrate_physics.py hou 로 생성. 정상 해는 plant_hou.yaml 의 운전점 μ 를 재현한다.
# 밀도·회전수·효율·체절 비·배관 치수·분기 압력 비율·NPSHr·정상 NPSH 여유비·유체 온도는 합성 설계 선택이며 현장 자료가 아니다.
