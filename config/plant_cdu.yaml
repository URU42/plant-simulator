# 구성안: CDU (상압증류) (PL-CDU) — 다중 공장 설계 docs/superpowers/specs/2026-11-09-multi-plant-design.md
# - 출처: cdu-sample/data/CDU_*.xlsx 의 `설비 설명`(계층)·`설비 태그`(태그명·설명·단위·정상 기준·경고/알람/정지 상·하한·근거) 시트. 마스터 값은 그대로.
# - 태그명은 같은 설비 안에서만 고유하다 (복합키 (equip_id, tag_id)). 한계값·정상 기준·근거는 자료 그대로이며 빈 칸은 적지 않았다.
# - decimals 는 데이터의 소수 자릿수.
# - 온도 10초, 나머지 1초. seed_key 는 공장 접두어를 붙여 다른 공장과 겹치지 않는다.

plant:
  plant_id: PL-CDU
  name: "CDU (상압증류)"
  config_version: 2
  unit_groups:
    - id: UG-CDU-01
      name: "원유 전처리"
      units:
        - { id: UNIT-CDU-01, name: "U-811" }
        - { id: UNIT-CDU-02, name: "U-812" }
    - id: UG-CDU-02
      name: "원유 가열"
      units:
        - { id: UNIT-CDU-03, name: "U-821" }
    - id: UG-CDU-03
      name: "상압증류"
      units:
        - { id: UNIT-CDU-04, name: "U-831" }
        - { id: UNIT-CDU-05, name: "U-832" }
        - { id: UNIT-CDU-06, name: "U-833" }
    - id: UG-CDU-04
      name: "제품 회수"
      units:
        - { id: UNIT-CDU-07, name: "U-841" }

# 설비 유형 매핑. kind 는 기계 종류 (참고)
equipment_types:
  - { type: PM, name: 펌프, prefix: P, kind: pump }
  - { type: FN, name: 팬, prefix: F, kind: fan }

# 표준 태그 (신호 종류 · 대표 접두어 · 대표 단위). 태그별 실제 단위는 각 태그에 적는다
signals:
  - { signal: vibration, prefix: VI, unit: "mm/s RMS", name: 케이싱 진동 속도 }
  - { signal: bearing_temp, prefix: TI, unit: "DEG C", name: 베어링 온도 }
  - { signal: suction_pressure, prefix: PI, unit: "kg/cm2(g)", name: 흡입 압력 }
  - { signal: discharge_pressure, prefix: PI, unit: "kg/cm2(g)", name: 토출 압력 }
  - { signal: flow, prefix: FI, unit: "m3/h", name: 유량 }
  - { signal: current, prefix: II, unit: "A", name: 모터 전류 }
  - { signal: speed, prefix: SI, unit: "rpm", name: 회전속도 }
  - { signal: differential_pressure, prefix: PDI, unit: "mmH2O", name: 차압 }
  - { signal: process_temp, prefix: TI, unit: "DEG C", name: 공정 유체 온도 }

equipment:
  # ---------------- UNIT-CDU-01 U-811 ----------------
  - equip_id: P-8101A
    name: "원유 공급 펌프 A (Crude Charge Pump A)"
    type: PM
    unit_id: UNIT-CDU-01
    tags:
      - { tag_id: VI-8101A,
          signal: vibration,
          unit: "mm/s RMS",
          description: "펌프 구동측 진동",
          limits: { warn_hi: 3, alarm_hi: 4.5, trip_hi: 7.1 },
          normal_ref: "1.1~2.2",
          limit_basis: "경고 3.0=API 610 선호운전영역(POR) 한계, 알람 4.5/정지 7.1=ISO 20816-3 Group 1 강성지지 B/C·C/D 경계 (가정 적용)",
          interval_sec: 1,
          decimals: 4,
          seed_key: cdu-r001,
          control: { mean: 1.6466, sigma: 0.07598426116605081 } }
      - { tag_id: VI-8101B,
          signal: vibration,
          unit: "mm/s RMS",
          description: "펌프 반구동측 진동",
