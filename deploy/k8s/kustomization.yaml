# kubectl apply -k deploy/k8s -n u4-2
# 이미지: Harbor harbor.uru42.space 의 프로젝트 uru42. 배포할 태그로 newTag 를 바꾼다 (secret.example.yaml 은 참고용이라 포함하지 않는다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: harbor.uru42.space/uru42/plant-simulator
    newName: harbor.uru42.space/uru42/plant-simulator
    newTag: latest
