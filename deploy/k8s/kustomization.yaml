# being-gitops 의 k8s/plant-sim/kustomization.yaml 로 그대로 복사한다 (plant-sim-*.yaml 과 함께).
# Jenkins 파이프라인이 images.newTag 를 빌드마다 바꾼다. plant-sim-secret.example.yaml 은 참고용이라 포함하지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: u4-2

resources:
    - plant-sim-pvc.yaml
    - plant-sim-deployment.yaml
    - plant-sim-service.yaml
    - plant-sim-ingress.yaml

images:
    - name: harbor.uru42.space/uru42/plant-simulator
      newName: harbor.uru42.space/uru42/plant-simulator
      newTag: latest
