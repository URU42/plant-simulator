# 다섯 공장의 SQLite 파일. 하루 보관 기준 원시값 약 3.5 GB 에서 고정되고 집계가 1년에 약 2 GB 쌓인다.
# 10Gi 면 2~3년 여유. 모자라면 PVC 는 늘릴 수 있지만(allowVolumeExpansion) 줄일 수는 없다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plant-sim-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ebs-sc
  resources:
    requests: { storage: 10Gi }
