# 실제 값은 커밋하지 않는다. 만들 때:
#   kubectl -n u4-2 create secret generic plant-sim --from-literal=ingest-token='<임의의 긴 문자열>'
#   kubectl -n u4-2 create secret generic plant-sim-scenarios --from-file=scenario_cdu.yaml=<평가용 파일> ...   (선택)
#   kubectl -n u4-2 create configmap plant-sim --from-literal=cors-origins='https://u4-2.skala-us.com'       (선택)
apiVersion: v1
kind: Secret
metadata:
  name: plant-sim
type: Opaque
stringData:
  ingest-token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: plant-sim-scenarios
type: Opaque
stringData: {}      # scenario_<key>.yaml 파일 이름으로 넣는다. 시뮬레이터에만 적용되고 이력에는 들어가지 않는다
