# 클러스터 안의 다른 파드(backend · agent)는 http://plant-sim.u4-2.svc.cluster.local:8000/{공장}/... 로 부른다 (접두어 없음)
apiVersion: v1
kind: Service
metadata:
  name: plant-sim
  labels: { app: plant-sim }
spec:
  type: ClusterIP
  selector: { app: plant-sim }
  ports:
    - { name: http, port: 8000, targetPort: http }
