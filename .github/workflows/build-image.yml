# 이미지를 빌드해 Harbor 로 올린다 (k8s 설계 §4.6). 수동 실행 또는 v* 태그 push.
# Harbor 가 사내망 전용이면 GitHub 호스티드 러너에서 닿지 않는다. 그 경우 self-hosted 러너를 쓰거나 README 의 PC 빌드 명령을 쓴다.
# 저장소 secrets: HARBOR_USERNAME, HARBOR_PASSWORD. 레지스트리·프로젝트는 아래 env (harbor.uru42.space / uru42).
name: build-image
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
env:
  HARBOR_REGISTRY: harbor.uru42.space
  HARBOR_PROJECT: uru42
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/plant-simulator:sha-${{ github.sha }}
            ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/plant-simulator:latest
