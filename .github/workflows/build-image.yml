# 이미지를 빌드해 Harbor 로 올린다 (k8s 설계 §4.6). 수동 실행 또는 v* 태그 push.
# Harbor 가 사내망 전용이면 GitHub 호스티드 러너에서 닿지 않는다. 그 경우 self-hosted 러너를 쓰거나 README 의 PC 빌드 명령을 쓴다.
# 저장소 secrets: HARBOR_REGISTRY (예: harbor.example.com), HARBOR_PROJECT (예: u4-2), HARBOR_USERNAME, HARBOR_PASSWORD
name: build-image
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/plant-simulator:sha-${{ github.sha }}
            ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/plant-simulator:latest
